name: Native capsule
on:
  pull_request:
    branches: [main, beta]
  workflow_dispatch:
jobs:
  native-capsule:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: openless-all/app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: openless-all/app
      - run: cargo check --locked -p openless-native-capsule
      - run: cargo test --locked -p openless-capsule --features ui,host
      - run: cargo clippy --locked -p openless-native-capsule -p openless-capsule --features openless-capsule/ui,openless-capsule/host -- -D warnings
