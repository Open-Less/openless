name: Native capsule

# The capsule crates (`openless-native-capsule`, `openless-capsule`) compile into
# the desktop shells, so a break there would otherwise only surface inside the
# long Tauri matrix. They are checked on both desktop platforms in a job of their
# own.
#
# `push` on the default branches is what keeps the Rust cache warm: a
# pull-request-only workflow can never save a tree the next PR is allowed to
# restore, because GitHub scopes caches to the ref that saved them.
on:
  pull_request:
    branches: [main, beta]
  push:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Repeated pushes to one pull request cancel the older run; beta pushes queue.
  group: native-capsule-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-capsule:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: openless-all/app
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Stable prefix per platform instead of the job name, so the same tree
          # is reused if the job is ever split or renamed.
          shared-key: native-capsule
          workspaces: openless-all/app -> target
          # Pull requests restore the beta tree and never write their own copy:
          # `refs/pull/<n>/merge` scopes are never restored again and only evict
          # the branch caches (see docs/ci-trigger-and-cache-policy.md).
          save-if: ${{ github.ref == 'refs/heads/beta' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
      - run: cargo check --locked -p openless-native-capsule
      - run: cargo test --locked -p openless-capsule --features ui,host
      - run: cargo clippy --locked -p openless-native-capsule -p openless-capsule --features openless-capsule/ui,openless-capsule/host -- -D warnings
