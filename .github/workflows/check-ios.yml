name: iOS source checks

on:
  pull_request:
    paths:
      - 'openless-all/ios/**'
      - 'openless-all/app/crates/openless-core/**'
      - '.github/workflows/check-ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Test shared keyboard contracts
        run: swift test --package-path openless-all/ios/Packages/OpenLessShared
      - name: Test the iOS Core host
        run: cargo test --manifest-path openless-all/ios/CoreHost/Cargo.toml --locked
      - name: Validate interface resources
        run: python3 openless-all/ios/scripts/test-interface-resources.py
