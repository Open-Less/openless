name: iOS tests and device build

on:
  # PRs only read the shared Rust caches. Keep a default-branch writer so the
  # first PR does not create an isolated cache that later PRs cannot restore.
  push:
    branches: [main, beta]
    paths:
      - 'openless-all/ios/**'
      - 'openless-all/app/crates/openless-core/**'
      - 'openless-all/app/crates/micyou-*/**'
      - 'openless-all/app/contract/**'
      - 'openless-all/app/assets/**'
      - '.github/workflows/check-ios.yml'
  pull_request:
    paths:
      - 'openless-all/ios/**'
      - 'openless-all/app/crates/openless-core/**'
      - 'openless-all/app/crates/micyou-*/**'
      - 'openless-all/app/contract/**'
      - 'openless-all/app/assets/**'
      - '.github/workflows/check-ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Supersede older checks of the same kind. A manual run must not cancel the
  # PR check required for merging, or the push run that maintains beta caches.
  group: ios-checks-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  changes:
    # Shared Rust changes also need real device-target compilation. The area
    # detector covers the iOS Core dependency graph and Xcode project layer.
    name: Changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      # Dashes are not valid inside an output reference, so the area name and the
      # output key differ here on purpose.
      device: ${{ steps.detect.outputs.device }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect iOS project changes
        id: detect
        working-directory: openless-all/app
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          verdict=$(bash scripts/ci-changed-areas.sh ios-device "$BASE_SHA")
          # Fail open: only an explicit `false` skips the device build.
          decision=$( [ "$verdict" = 'false' ] && echo false || echo true )
          echo "ios-device=$decision"
          echo "device=$decision" >> "$GITHUB_OUTPUT"

  test:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy
      - name: Record the unchanged shared source baseline
        run: |
          git diff --exit-code HEAD -- openless-all/app
          git rev-parse HEAD:openless-all/app
      - name: Prepare the isolated mobile Core
        run: python3 openless-all/ios/scripts/prepare-core.py
      - name: Resolve Xcode cache identity
        id: xcode
        run: echo "version=$(xcodebuild -version | tr '\n' '-')" >> "$GITHUB_OUTPUT"
      - name: Cache iOS host Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          shared-key: ios-host
          key: ${{ steps.xcode.outputs.version }}
          workspaces: 'openless-all/ios/CoreHost -> target'
          save-if: ${{ github.ref == 'refs/heads/beta' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
      - name: Test shared keyboard contracts
        timeout-minutes: 5
        run: swift test --package-path openless-all/ios/Packages/OpenLessShared
      - name: Test mobile Core and iOS Host
        timeout-minutes: 12
        run: cargo test --manifest-path openless-all/ios/CoreHost/Cargo.toml --workspace --lib --locked --timings
      - name: Check mobile Core
        timeout-minutes: 5
        run: cargo clippy --manifest-path openless-all/ios/CoreHost/Cargo.toml -p openless-core --all-targets --locked -- -D warnings
      - name: Test interface resources, predictions and native audio
        timeout-minutes: 5
        working-directory: openless-all/ios
        run: |
          python3 scripts/test-interface-resources.py
          python3 scripts/build-predictions.py
          bash scripts/test-predictions.sh
          bash scripts/test-audio.sh
      - name: Verify shared sources were not modified
        run: git diff --exit-code -- openless-all/app
      - name: Upload host Cargo timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-host-cargo-timings
          path: openless-all/ios/CoreHost/target/cargo-timings/
          if-no-files-found: ignore
          retention-days: 7

  device-build:
    # Separate runners and no artifacts exchanged with `test`: compile in
    # parallel. Both existing checks still report their own failures.
    needs: [changes]
    if: needs.changes.outputs.device != 'false'
    runs-on: xcode-27
    timeout-minutes: 60
    defaults:
      run:
        working-directory: openless-all/ios
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: aarch64-apple-ios
      - name: Prepare native build tools and dependencies
        timeout-minutes: 10
        run: |
          xcodebuild -version
          command -v cmake >/dev/null || brew install cmake
          bash scripts/bootstrap.sh
      - name: Resolve Xcode cache identity
        id: xcode
        run: echo "version=$(xcodebuild -version | tr '\n' '-')" >> "$GITHUB_OUTPUT"
      - name: Cache iOS device Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          shared-key: ios-device
          key: ios16-${{ steps.xcode.outputs.version }}
          workspaces: 'openless-all/ios/CoreHost -> ../.build/core-ios16'
          save-if: ${{ github.ref == 'refs/heads/beta' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
      - name: Prepare verified local speech dependencies
        timeout-minutes: 10
        run: bash scripts/bootstrap-local-speech.sh
      - name: Build Rime and test composition
        timeout-minutes: 12
        run: |
          bash scripts/build-rime.sh host
          bash scripts/test-rime.sh
          bash scripts/build-rime.sh device
      - name: Build the mobile Core and refresh attribution
        timeout-minutes: 10
        run: |
          bash scripts/build-core.sh device
          python3 scripts/collect-rust-licenses.py
      - name: Build and validate the unsigned iPhone app
        timeout-minutes: 12
        env:
          OPENLESS_DERIVED_DATA: ${{ runner.temp }}/ios-device
        run: |
          python3 scripts/validate-project.py
          bash scripts/build.sh device Release unsigned
          python3 scripts/package-ipa.py \
            "$OPENLESS_DERIVED_DATA/Build/Products/Release-iphoneos/OpenLess.app" \
            "$RUNNER_TEMP/OpenLess-ci-unsigned.ipa"
      - name: Verify shared sources were not modified
        run: git diff --exit-code -- ../app
      - name: Upload device Cargo timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-device-cargo-timings
          path: openless-all/ios/.build/core-ios16/cargo-timings/
          if-no-files-found: ignore
          retention-days: 7

