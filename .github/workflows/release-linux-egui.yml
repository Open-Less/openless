name: Release Linux egui

# Linux may accompany a desktop release only after independent device acceptance.
# Both automatic dispatch and the reusable publication job require the repository
# variable LINUX_ACCEPTED_RELEASE_TAG to match the immutable release tag exactly.
# Build-only dispatches remain available without authorizing publication.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild and attach (v<version>-tauri)
        required: true
        type: string
      publish:
        description: Attach the verified packages to that Release
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-linux-egui-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-linux-egui:
    permissions:
      contents: write
    uses: ./.github/workflows/check-linux-egui.yml
    with:
      scope: full
      release_tag: ${{ inputs.tag }}
      publish: ${{ inputs.publish }}
      checkout_ref: ${{ inputs.tag }}
