name: Release Linux egui

# Linux ships in the same GitHub Release as the desktop, Android and HarmonyOS
# assets.
#
# The entry point is dispatch-only (never a `push:` trigger), so nothing can
# rebuild Linux packages from an arbitrary commit: `release-tauri.yml` dispatches
# it automatically for a `v*-tauri` tag once the desktop assets are published,
# and an administrator keeps the manual dispatch as the repair path. Packaging
# runs the same Core/host/deb/rpm verification as CI and then attaches the
# verified packages to that Release automatically - nothing is uploaded by hand.
#
# Because the tag now ships Linux unattended, the L01-L12 device acceptance in
# docs/linux-egui-handoff/07-acceptance.md is a **pre-tag** gate: a tag must not
# be cut for a Linux state that has not been accepted on real hardware.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild and attach (v<version>-tauri)
        required: true
        type: string
      publish:
        description: Attach the verified packages to that Release
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-linux-egui-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-linux-egui:
    permissions:
      contents: write
    uses: ./.github/workflows/check-linux-egui.yml
    with:
      scope: full
      release_tag: ${{ inputs.tag }}
      publish: ${{ inputs.publish }}
      checkout_ref: ${{ inputs.tag }}
