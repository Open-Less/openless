name: Release Linux egui

# Independent Linux builds retain the same tests and deb/rpm packaging as CI.
# After product acceptance, an administrator builds the accepted release tag and
# explicitly attaches the verified Actions artifacts to that existing Release.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-linux-egui-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: false

jobs:
  build-linux-egui:
    permissions:
      contents: read
    uses: ./.github/workflows/check-linux-egui.yml
