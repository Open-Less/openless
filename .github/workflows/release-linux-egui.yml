name: Release Linux egui

# Linux ships in the same GitHub Release as the desktop and Android assets.
#
# The entry point stays manual: the tag is created by an administrator after the
# Linux host/UI acceptance in docs/linux-egui-handoff/07-acceptance.md, and this
# workflow only rebuilds that already-reviewed tag. It never reacts to Tauri
# tags, so a desktop release can never ship an unaccepted Linux package by
# accident; but once dispatched, the packages are attached to the Release
# automatically instead of being uploaded by hand.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild and attach (v<version>-tauri)
        required: true
        type: string
      publish:
        description: Attach the verified packages to that Release
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-linux-egui-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-linux-egui:
    permissions:
      contents: write
    uses: ./.github/workflows/check-linux-egui.yml
    with:
      scope: full
      release_tag: ${{ inputs.tag }}
      publish: ${{ inputs.publish }}
      checkout_ref: ${{ inputs.tag }}
