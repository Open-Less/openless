name: CI

# 多平台跨语言质量门禁。release-tauri.yml 是发版流水线（仅打包构建），这里负责
# 在合并前快速验证两件事：
#   1. 前端 typecheck + vite bundle 通过（tsc + vite build，捕获跨 locale 类型 drift）
#   2. Rust 后端在 macOS / Windows / Linux 都能 cargo check 过（捕获 cfg 漏分支 / 平台 API 误用）
# 跑 build-mac.sh / windows-package-msvc.ps1 / Tauri bundle 太重；只跑轻量 cargo check + vite build。

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]

jobs:
  cross-platform:
    name: ${{ matrix.label }} checks
    strategy:
      # 一个平台挂掉不阻塞其他平台拿到验证结果。
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            preflight: false
          # Rust 1.78+ 生成的 Windows 测试运行器会使用 WaitOnAddress。
          # 固定 Server 2022，减少 windows-latest/Server 2025 的镜像变量。
          - os: windows-2022
            label: Windows
            preflight: true
          - os: ubuntu-latest
            label: Linux
            preflight: false
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: openless-all/app
    steps:
      - uses: actions/checkout@v4
        with:
          # vendor/qwen-asr 是 macOS 上 build.rs 必须的 git submodule。Windows
          # checkout 也拉一份保持与 release-tauri.yml 一致，开销几秒可以忽略。
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: openless-all/app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux check dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libasound2-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Install frontend dependencies
        run: npm ci

      - name: Check Windows prerequisites
        if: matrix.preflight
        shell: pwsh
        run: ./scripts/windows-preflight.ps1 -Toolchain msvc

      - name: Check PowerShell scripts
        if: matrix.preflight
        shell: pwsh
        run: |
          foreach ($script in @("./scripts/windows-preflight.ps1", "./scripts/windows-build-gnu.ps1", "./scripts/windows-runtime-smoke.ps1")) {
            $errors = $null
            [System.Management.Automation.PSParser]::Tokenize((Get-Content -Raw $script), [ref]$errors) | Out-Null
            if ($errors) {
              $errors | Format-List
              exit 1
            }
          }

      - name: Build frontend (tsc + vite)
        run: npm run build

      - name: Check Tauri backend (cargo check)
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Run Rust backend unit tests
        if: runner.os != 'Windows'
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Run Rust backend unit tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Foundry/WinML SDK 以及 Rust 1.78+ 的 Windows test harness 在
          # GitHub runner 上都可能让进程启动前因 native entrypoint 退出。
          # 产品默认构建仍通过 cargo check 覆盖 Foundry 链接形态，单测门禁
          # 用无 Foundry native 链接的构建来真正执行 Windows 后端测试。
          # 单测使用独立 target 目录，避免前面的默认特性 cargo check 产物
          # 影响无 Foundry native 链接的测试进程 DLL 搜索路径。
          $env:CARGO_TARGET_DIR = Join-Path (Get-Location) "src-tauri\target\windows-unit-tests"
          $testArgs = @(
            "--manifest-path", "src-tauri/Cargo.toml",
            "--lib",
            "--no-default-features",
            "--features", "custom-protocol"
          )

          # rustc 1.78+ 生成的 Windows 二进制会导入 WaitOnAddress 所在的
          # api-ms-win-core-synch-l1-2-0.dll。GitHub runner 上该 API-set
          # 解析缺 entrypoint 时，测试进程会在任何单测运行前退出。这里先
          # no-run 产出测试 exe，再把该 import 指向 Server 2022 自带且导出
          # WaitOnAddress 的 KernelBase.dll，最后仍然执行 cargo test。
          cargo test @testArgs --no-run
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $depsDir = Join-Path $env:CARGO_TARGET_DIR "debug\deps"
          $needleText = "api-ms-win-core-synch-l1-2-0.dll" + [char]0
          $replacementText = "kernelbase.dll" + [char]0
          $encoding = [System.Text.Encoding]::GetEncoding("iso-8859-1")
          $needle = $encoding.GetBytes($needleText)
          $replacement = New-Object byte[] $needle.Length
          $replacementBytes = $encoding.GetBytes($replacementText)
          [Array]::Copy($replacementBytes, $replacement, $replacementBytes.Length)
          $patchedAny = $false
          Get-ChildItem -Path $depsDir -Filter "openless_lib-*.exe" | ForEach-Object {
            $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
            $text = $encoding.GetString($bytes)
            $offset = $text.IndexOf($needleText, [System.StringComparison]::Ordinal)
            $patchedThis = $false
            while ($offset -ge 0) {
              [Array]::Copy($replacement, 0, $bytes, $offset, $replacement.Length)
              $patchedThis = $true
              $patchedAny = $true
              $offset = $text.IndexOf($needleText, $offset + $needle.Length, [System.StringComparison]::Ordinal)
            }
            if ($patchedThis) {
              [System.IO.File]::WriteAllBytes($_.FullName, $bytes)
              Write-Host "[ci] Patched Windows Rust test import to KernelBase.dll: $($_.FullName)"
            }
          }
          if (-not $patchedAny) {
            throw "api-ms-win-core-synch-l1-2-0.dll import not found in Windows Rust test executable."
          }

          cargo test @testArgs

      - name: Verify version sync across all 5 files
        # 两个平台都跑这个校验：Windows runner 自带 git-bash，跨 shell 表现一致。
        # 一旦版本号 drift 立刻 fail，避免发版时再发现漏改。
        # 校验 5 处：package.json / package-lock.json (root + nested) /
        # tauri.conf.json / Cargo.toml / Cargo.lock 的 [openless] 包。
        shell: bash
        run: |
          PKG=$(node -p "require('./package.json').version")
          LOCK_ROOT=$(node -p "require('./package-lock.json').version")
          LOCK_NESTED=$(node -p "require('./package-lock.json').packages[''].version")
          TAU=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CRG=$(grep -E '^version = ' src-tauri/Cargo.toml | head -1 | sed -E 's/^version = "(.+)"$/\1/')
          # Cargo.lock：找 [openless] 包紧跟的 version 行
          CARGO_LOCK_VER=$(awk 'BEGIN{found=0} /^name = "openless"$/{found=1; next} found && /^version = /{gsub(/"/,""); print $3; exit}' src-tauri/Cargo.lock)
          echo "package.json         = $PKG"
          echo "package-lock root    = $LOCK_ROOT"
          echo "package-lock nested  = $LOCK_NESTED"
          echo "tauri.conf.json      = $TAU"
          echo "Cargo.toml           = $CRG"
          echo "Cargo.lock openless  = $CARGO_LOCK_VER"
          mismatch=0
          for v in "$LOCK_ROOT" "$LOCK_NESTED" "$TAU" "$CRG" "$CARGO_LOCK_VER"; do
            if [ "$v" != "$PKG" ]; then mismatch=1; fi
          done
          if [ "$mismatch" -ne 0 ]; then
            echo "::error::版本号未对齐 — 请用 scripts/bump-version.sh 同步更新"
            exit 1
          fi
          echo "[ok] 全部 5 处版本号一致：$PKG"
