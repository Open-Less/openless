name: Release cross-platform (Tauri + Linux egui)
# meta: ensure Actions indexes this workflow on forks (no behavior change).
#
# 这是**唯一一条**发版流水线：一次 tag 推送、同一个 run 里四个平台并发构建，
# 所有产物堆在同一个 GitHub Release 下。
#
# tag 约定（统一语义）：任何发布标签 `v*` 都构建并发布**全部**平台，例如
#   v2.0.0-Beta.1-egui / v2.0.0-tauri。`-tauri` / `-egui` 只是**命名约定**
#   （影响产物名与版本串），不再是「只构建哪一半」的开关。
#   → macOS arm64 .dmg + macOS x64 .dmg + Windows x64 .msi/.exe + Linux deb/rpm
#     （Linux 步骤**内联**在本文件里、与三个平台平级并发：不用 workflow_call，
#      否则 Actions 页面会把 Linux 渲染成嵌套折叠的一层）
#   → 安卓 APK 由 android-apk.yml **并行**跑（另一套工具链：JDK/SDK/Gradle），
#     同样对 `v*` 触发，资产挂到**同一个 release**上。
#   → linux-egui job 在**同一个 job 内**完成 deb/rpm 打包 + 手动安装 zip 组装：
#     zip 装的是散装安装树（usr/...）+ install.sh + 针对散装文件重算的 SHA256SUMS，
#     **不含 deb/rpm**（能装包的人直接下 release 里的 deb/rpm 资产，那两份仍保留）；
#     macOS/Windows 的 dmg/msi/exe 各自作为独立 release 资产，不进这个 zip。
#   → 后缀是「本次发布同时覆盖 Linux egui」的标记，不是平台分发开关；
#     Linux 产物名自带 egui 标识（OpenLess-Linux-egui-<ver>-<arch>.deb/.rpm），
#     与桌面包区分。
#
# 历史 tag 兼容：v<version>-tauri（含 -beta-tauri / -Beta.N-tauri）仍然可用，
#   保持旧行为：只出 Tauri 三平台（不跑 Linux egui job）。已发布的 v*-tauri
#   release 不受影响；把发布迁移到 -egui 后需要注意的外部引用列在下面。
#
# 迁到 -egui tag 后仍需跟进的仓库外部引用（不在本工作流范围内，见报告）：
#   - Casks/openless.rb 的下载 URL 写死了 v#{version}-tauri
#   - README.md / README.zh.md 的维护者发布清单只写了 v<version>-tauri
#   - scripts/bump-version.sh 结尾提示的 tag 命令只拼了 -tauri
#   - android-apk.yml 只在 v*-tauri 上触发（APK 因此不在 -egui 发布里）
# 保留旧名不删是为了能让历史 -egui/-tauri release 重跑时行为可预测。
#
# 手动 dispatch（测试构建，不发版）→ 四平台都构建，release 相关步骤全部跳过。

# macOS 分发：
#   - 配好 APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_ID /
#     APPLE_PASSWORD / APPLE_TEAM_ID 后，Tauri 会做 Developer ID 签名和公证。
#     用户从浏览器下载后不需要手工 xattr。
#   - 未配置 Apple secrets 时自动回退 ad-hoc 签名，GitHub Actions 会打印 warning。
#   - Windows 没签名（无证书）,Win 11 SmartScreen 会警告 "未识别的发布者",用户点"仍要运行"。
#   - 任意一个 platform 失败不影响另一个继续构建（fail-fast: false）。

on:
  push:
    # 统一语义：任何发布标签都构建**全部**平台（Tauri 三平台 + Linux egui + 安卓）。
    # `-tauri` / `-egui` 只是命名约定（产物名/版本串沿用），不再决定构建哪一半。
    # 安卓不在本文件里：它用另一套工具链（JDK/Android SDK/Gradle），由
    # android-apk.yml 并行跑，资产落到同一个 release 上。
    tags:
      - 'v*'
  workflow_dispatch:

# 同一 tag 重复推送只跑最新一次；workflow_dispatch 用 run_id 隔离避免互相取消。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build:
    # 统一发布语义：任何发布标签（或手动 dispatch）都跑 Tauri 三平台。
    if: ${{ !cancelled() }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust-target: aarch64-apple-darwin
            updater-target: darwin
            updater-arch: aarch64
          - platform: macos-15-intel
            rust-target: x86_64-apple-darwin
            updater-target: darwin
            updater-arch: x86_64
          - platform: windows-latest
            rust-target: x86_64-pc-windows-msvc
            updater-target: windows
            updater-arch: x86_64
    runs-on: ${{ matrix.platform }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # 渠道由 tag 后缀决定：
      #   v<v>-beta-tauri / v<v>-Beta.N-tauri
      #                    → beta 渠道（GitHub Release 标 prerelease，manifest 文件名带 -beta 后缀，
      #                      正式版用户的 endpoint 拿不到）
      #   v<v>-tauri       → stable 渠道（正式版，文件名沿用旧约定，向后兼容）
      # workflow_dispatch / 非 tag 触发时 github.ref_name 不是 tag 字符串，
      # endsWith 返回 false，回退为 stable，不改变现有 dispatch 行为。
      # -egui 是新约定的 tag：四平台全跑。历史 -tauri tag 保持只跑 Tauri 三平台，
      # 所以这条 job 的 if 里仍带上 -tauri。
      OPENLESS_RELEASE_CHANNEL: ${{ (endsWith(github.ref_name, '-beta-tauri') || endsWith(github.ref_name, '-beta-egui') || contains(github.ref_name, '-Beta.')) && 'beta' || 'stable' }}
    steps:
      - uses: actions/checkout@v6
        with:
          # MLX 子模块只在 macOS 发布构建需要。
          submodules: ${{ startsWith(matrix.platform, 'macos') && 'recursive' || 'false' }}

      - name: Disable macOS-only Qwen3 MLX dependency
        if: ${{ !startsWith(matrix.platform, 'macos') }}
        run: node openless-all/app/scripts/ci-disable-macos-qwen3.mjs

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: 'openless-all/app/package-lock.json'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'openless-all/app/src-tauri -> target'

      - name: Prepare Windows Sherpa static libraries
        if: matrix.platform == 'windows-latest'
        working-directory: 'openless-all/app'
        shell: pwsh
        run: ./scripts/prepare-windows-sherpa.ps1

      - name: Install npm deps
        working-directory: 'openless-all/app'
        run: npm ci

      - name: Check updater signing availability
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is required for signed auto-update artifacts."
            exit 1
          fi

      - name: Check Apple signing availability
        if: startsWith(matrix.platform, 'macos') && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::warning::macOS release will use ad-hoc signing because Apple signing/notarization secrets are missing: ${missing[*]}"
          fi

      - name: Import Apple Developer ID certificate
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "${APPLE_CERTIFICATE:-}" ] || [ -z "${APPLE_CERTIFICATE_PASSWORD:-}" ]; then
            echo "No Apple certificate secrets configured; macOS build will use ad-hoc signing."
            exit 0
          fi

          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-$(openssl rand -base64 32)}"
          CERT_PATH="$RUNNER_TEMP/openless-certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/openless-build.keychain-db"

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          DEVELOPER_ID_INFO="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep 'Developer ID Application' | head -n 1)"
          if [ -n "$DEVELOPER_ID_INFO" ]; then
            CERT_INFO="$DEVELOPER_ID_INFO"
          else
            CERT_INFO="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -E 'Apple Distribution|Apple Development' | head -n 1)"
          fi
          if [ -z "$CERT_INFO" ]; then
            echo "Apple certificate imported, but no usable code-signing identity was found."
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            exit 1
          fi

          CERT_ID="$(echo "$CERT_INFO" | awk -F'"' '{print $2}')"
          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"
          echo "Imported Apple signing identity: $CERT_ID"

      - name: Configure Apple notarization
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PROVIDER_SHORT_NAME: ${{ secrets.APPLE_PROVIDER_SHORT_NAME }}
        run: |
          for name in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_PROVIDER_SHORT_NAME; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              echo "$name=$value" >> "$GITHUB_ENV"
            fi
          done

      # ── macOS：用我们自己的 build-mac.sh，统一处理签名、公证和 artifact 清理 ──
      - name: Build (macOS)
        if: startsWith(matrix.platform, 'macos')
        working-directory: 'openless-all/app'
        env:
          INSTALL: '0'        # CI 不要装到 /Applications,也不要 reset TCC
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/build-mac.sh

      # ── Windows：先 build OpenLessIme.dll(x64+x86)，再跑 tauri bundle。
      #    openless-ime.wxs 用 $(env.OPENLESS_IME_DLL_X64) / _X86 拿绝对路径，
      #    跨 candle/light cwd 都能 resolve（Tauri wix bundler cwd 不固定）。
      - name: Build Windows IME native DLLs
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        working-directory: 'openless-all/app'
        run: |
          $appRoot = (Resolve-Path .).Path
          foreach ($t in @(
            @{ Platform = 'x64';   Folder = 'x64'; EnvName = 'OPENLESS_IME_DLL_X64' },
            @{ Platform = 'Win32'; Folder = 'x86'; EnvName = 'OPENLESS_IME_DLL_X86' }
          )) {
            $out = Join-Path $appRoot "src-tauri\target\windows-ime-msvc\$($t.Folder)\Release"
            $obj = Join-Path $appRoot "src-tauri\target\windows-ime-msvc\obj\$($t.Folder)\Release"
            ./scripts/windows-ime-build.ps1 -Configuration Release -Platform $t.Platform -OutputDirectory $out -IntermediateDirectory $obj
            if ($LASTEXITCODE -ne 0) {
              throw "OpenLessIme $($t.Platform) build failed with exit $LASTEXITCODE"
            }
            $dll = (Resolve-Path (Join-Path $out 'OpenLessIme.dll')).Path
            if (-not (Test-Path $dll)) {
              throw "OpenLessIme.dll not produced at $dll"
            }
            "$($t.EnvName)=$dll" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "[ok] built $dll (exported $($t.EnvName))"

            # bundle.resources 引用的是 src-tauri/openless-ime-payload/{x64,x86}/OpenLessIme.dll
            # （仓库里 commit 的是 0 字节占位让 mac 本地 build 也能 resolve）。
            # 这里用真 dll 覆盖占位，让 NSIS / MSI 都装上真文件；NSIS hook 的 regsvr32
            # 同时会把 64 / 32 位 COM 注册到 HKLM\Software\Classes\CLSID 的
            # KEY_WOW64_64KEY / KEY_WOW64_32KEY 两侧（windows_ime_profile.rs 都会查）。
            $payloadDir = Join-Path $appRoot "src-tauri\openless-ime-payload\$($t.Folder)"
            New-Item -ItemType Directory -Force -Path $payloadDir | Out-Null
            Copy-Item -Force -Path $dll -Destination (Join-Path $payloadDir 'OpenLessIme.dll')
            Write-Host "[ok] copied real $($t.Folder) dll into bundle.resources payload path"
          }

      # ── Windows tauri build：保持 bash shell，因为 PowerShell 调外部命令
      #    会把 '{"bundle":...}' 的内部双引号吃掉、让 tauri 收到无效 JSON。
      #    用 set +e + GITHUB_ENV 把 exit code 传到下一步给 Repair 判断。
      - name: Build (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        working-directory: 'openless-all/app'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set +e
          # WiX/MSI only accepts a numeric prerelease identifier.  Manual
          # validation runs use the repository's Beta version even though the
          # ref is a branch (and therefore OPENLESS_RELEASE_CHANNEL=stable),
          # so detect the version explicitly instead of relying on the tag.
          app_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          msi_supported=1
          if [[ "$app_version" =~ -[^0-9] ]]; then
            msi_supported=0
            echo "[info] Skipping MSI bundle for non-numeric prerelease version $app_version."
          fi
          # 拆两轮跑：Tauri 的签名 / updater artifact 阶段是 post-bundle 钩子，
          # 任意 bundler 失败会让 *所有* bundle 的 .sig 跳过。MSI 必踩 ICE80，
          # 所以单一 `tauri build` 永远拿不到 NSIS 的 .exe.sig。
          # Pass 1：NSIS 独立跑——必须成功，产出 *_x64-setup.exe(.sig) 给 updater。
          # Pass 2：MSI 独立跑——允许失败，Repair 步骤兜底 light.exe 重链。
          # Beta 版跳过 MSI：Windows Installer / WiX 无法表示 `1.2.3-Beta.1`
          # 这类非纯数字 prerelease 标识，稳定版仍然照常产出 MSI。
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            npm run tauri -- build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":true}}'
            nsis_exit=$?
            if [ "${OPENLESS_RELEASE_CHANNEL:-stable}" = "beta" ] || [ "$msi_supported" -eq 0 ]; then
              echo "OPENLESS_SKIP_WINDOWS_MSI=1" >> "$GITHUB_ENV"
              echo "[info] Skipping MSI bundle for unsupported prerelease/channel."
              msi_exit=0
            else
              echo "OPENLESS_SKIP_WINDOWS_MSI=0" >> "$GITHUB_ENV"
              npm run tauri -- build --bundles msi --config '{"bundle":{"createUpdaterArtifacts":true}}'
              msi_exit=$?
            fi
          else
            npm run tauri -- build --bundles nsis
            nsis_exit=$?
            if [ "${OPENLESS_RELEASE_CHANNEL:-stable}" = "beta" ] || [ "$msi_supported" -eq 0 ]; then
              echo "OPENLESS_SKIP_WINDOWS_MSI=1" >> "$GITHUB_ENV"
              echo "[info] Skipping MSI bundle for unsupported prerelease/channel."
              msi_exit=0
            else
              echo "OPENLESS_SKIP_WINDOWS_MSI=0" >> "$GITHUB_ENV"
              npm run tauri -- build --bundles msi
              msi_exit=$?
            fi
          fi
          echo "TAURI_BUILD_EXIT=$msi_exit" >> "$GITHUB_ENV"
          # NSIS 是 updater 的硬依赖，挂了就直接 fail step。
          if [ "$nsis_exit" -ne 0 ]; then
            echo "::error::NSIS bundle failed (exit $nsis_exit) — updater artifact unavailable."
            exit 1
          fi
          # MSI 失败不挡——下一步 Repair 用 light.exe 重链（带 -sice:ICE80）。
          exit 0

      # ── 如果 tauri 在 wix link 阶段失败（candle 出了 wixobj，但 light 因 cwd
      #    解析 wxs Source 找不到 IME DLL），从 appRoot 手动跑 light 兜底重链。
      #    这是本地 windows-package-msvc.ps1::Repair-TauriMsiBundle 的同款手术。
      - name: Repair Windows MSI if Tauri failed at WiX link
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        working-directory: 'openless-all/app'
        run: |
          $exitCode = $env:TAURI_BUILD_EXIT
          if ($env:OPENLESS_SKIP_WINDOWS_MSI -eq '1') {
            Write-Host "[ok] Skipping MSI repair for beta release channel."
            return
          }
          $appRoot = (Resolve-Path .).Path
          $msi = Get-ChildItem "src-tauri\target\release\bundle\msi\*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) {
            Write-Host "[ok] MSI already produced by tauri: $($msi.FullName); no repair needed."
            return
          }
          if (-not $exitCode -or $exitCode -eq '0') {
            throw "Tauri exited 0 but no MSI found at src-tauri\target\release\bundle\msi\"
          }
          Write-Warning "Tauri MSI failed (exit $exitCode). Attempting manual light.exe relink from app root."
          $wixRoot = Join-Path $appRoot 'src-tauri\target\release\wix\x64'
          $mainObj = Join-Path $wixRoot 'main.wixobj'
          $imeObj  = Join-Path $wixRoot 'openless-ime.wixobj'
          $locale  = Join-Path $wixRoot 'locale.wxl'
          foreach ($p in @($mainObj, $imeObj, $locale)) {
            if (-not (Test-Path $p)) {
              throw "Required WiX object missing: $p — tauri build aborted before candle ran. Check the Build (Windows) step log."
            }
          }
          $light = Get-ChildItem "$env:LOCALAPPDATA\tauri\WixTools*\light.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName |
            Select-Object -Last 1 -ExpandProperty FullName
          if (-not $light) { throw "WiX light.exe not found under $env:LOCALAPPDATA\tauri\WixTools*" }
          $version = (Get-Content src-tauri\tauri.conf.json -Raw | ConvertFrom-Json).version
          $bundleDir = Join-Path $appRoot 'src-tauri\target\release\bundle\msi'
          New-Item -ItemType Directory -Force -Path $bundleDir | Out-Null
          $msiPath = Join-Path $bundleDir "OpenLess_${version}_x64_en-US.msi"
          Push-Location $appRoot
          try {
            # -sice:ICE80：x86 IME DLL 与 x64 一同打进 INSTALLDIR\windows-ime\，
            # 这是 32 位组件落在 64 位 Directory 下的合法场景（DLL 路径绝对指向，
            # 不依赖 SysWOW64 重定向）。Tauri 自身没有暴露 light 透传参数，所以
            # 必须在这里抑制，否则 LGHT0204 必失败。
            & $light -nologo -sice:ICE80 -ext WixUIExtension -ext WixUtilExtension -loc $locale -out $msiPath $mainObj $imeObj
            if ($LASTEXITCODE -ne 0) { throw "light.exe relink failed with exit $LASTEXITCODE" }
          } finally {
            Pop-Location
          }
          Write-Host "[ok] MSI rebuilt at $msiPath"

      - name: Verify Windows installers register TSF IME
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        working-directory: 'openless-all/app'
        run: |
          $nsis = Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe" -ErrorAction Stop | Select-Object -First 1
          if (-not $nsis) { throw "NSIS installer not found." }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\windows-ime-install-smoke.ps1 -InstallerPath $nsis.FullName -InstallerKind nsis
          if ($LASTEXITCODE -ne 0) {
            throw "NSIS installer smoke failed with exit $LASTEXITCODE"
          }
          if ($env:OPENLESS_SKIP_WINDOWS_MSI -eq '1') {
            Write-Host "[ok] Skipping MSI smoke for beta release channel."
            return
          }
          $msi = Get-ChildItem "src-tauri\target\release\bundle\msi\*.msi" -ErrorAction Stop | Select-Object -First 1
          if (-not $msi) { throw "MSI installer not found." }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\windows-ime-install-smoke.ps1 -InstallerPath $msi.FullName -InstallerKind msi
          if ($LASTEXITCODE -ne 0) {
            throw "MSI installer smoke failed with exit $LASTEXITCODE"
          }

      - name: Disambiguate macOS updater bundle filename
        if: startsWith(matrix.platform, 'macos') && env.TAURI_SIGNING_PRIVATE_KEY != ''
        shell: bash
        working-directory: 'openless-all/app/src-tauri/target/release/bundle/macos'
        run: |
          if [ -f OpenLess.app.tar.gz ]; then
            mv OpenLess.app.tar.gz "OpenLess_${{ matrix.updater-arch }}.app.tar.gz"
          fi
          if [ -f OpenLess.app.tar.gz.sig ]; then
            mv OpenLess.app.tar.gz.sig "OpenLess_${{ matrix.updater-arch }}.app.tar.gz.sig"
          fi

      - name: Write updater manifest
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        shell: bash
        working-directory: 'openless-all/app'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          OPENLESS_UPDATE_TARGET: ${{ matrix.updater-target }}
          OPENLESS_UPDATE_ARCH: ${{ matrix.updater-arch }}
          OPENLESS_UPDATE_REPO: Open-Less/openless
          OPENLESS_UPDATE_MIRROR_BASE_URL: https://fastgit.cc/https://github.com
          # beta 渠道时输出 latest-{tgt}-{arch}-beta.json，stable 沿用旧文件名。
          OPENLESS_RELEASE_CHANNEL: ${{ env.OPENLESS_RELEASE_CHANNEL }}
          # Beta 渠道里脚本要把 manifest.url 写成 releases/download/<tag>/...
          # 而不是 releases/latest（后者永远 = Stable，Beta 用户按 url 下载会拉到错文件）。
          # workflow_dispatch 时 github.ref_name 不是 tag——但那种情况下 channel=stable，
          # 脚本不会读这个字段，安全。
          OPENLESS_RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/write-updater-manifest.mjs

      # ── 收集产物 ──
      - name: List artifacts (debug)
        shell: bash
        working-directory: 'openless-all/app/src-tauri/target/release/bundle'
        run: ls -la macos/ dmg/ nsis/ msi/ 2>/dev/null || true

      # 防御性步骤：剥掉 macOS 产物上任何残留扩展属性 / quarantine。
      # 理论上 GitHub Actions 输出的 .app/.dmg 不会带 com.apple.quarantine
      # （xattr 也不会通过 actions/upload-artifact 跨机器持久化），但保留这一步
      # 让"云端 artifact 一定干净"成为可验证的承诺。用户下载后再被本地浏览器
      # 加 quarantine 时，按 release notes 的 `xattr -cr` 一行即可消除。
      - name: Strip xattr / quarantine on macOS bundles
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        working-directory: 'openless-all/app/src-tauri/target/release/bundle'
        run: |
          for path in macos/*.app dmg/*.dmg; do
            if [ -e "$path" ]; then
              echo "▶ stripping xattr: $path"
              xattr -cr "$path" || true
              xattr -lr "$path" || true
            fi
          done

      - name: Upload macOS artifacts
        if: startsWith(matrix.platform, 'macos')
        uses: actions/upload-artifact@v7
        with:
          name: openless-macos-${{ matrix.updater-arch }}
          path: |
            openless-all/app/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload macOS updater artifacts
        if: startsWith(matrix.platform, 'macos') && env.TAURI_SIGNING_PRIVATE_KEY != ''
        uses: actions/upload-artifact@v7
        with:
          name: openless-macos-${{ matrix.updater-arch }}-updater
          path: |
            openless-all/app/src-tauri/target/release/bundle/macos/*.app.tar.gz
            openless-all/app/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            openless-all/app/src-tauri/target/release/bundle/latest-darwin-${{ matrix.updater-arch }}*.json
          if-no-files-found: error

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: openless-windows-x64
          path: |
            openless-all/app/src-tauri/target/release/bundle/nsis/*.exe
            openless-all/app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Upload Windows updater artifacts
        if: matrix.platform == 'windows-latest' && env.TAURI_SIGNING_PRIVATE_KEY != ''
        uses: actions/upload-artifact@v7
        with:
          name: openless-windows-x64-updater
          path: |
            openless-all/app/src-tauri/target/release/bundle/nsis/*.exe.sig
            openless-all/app/src-tauri/target/release/bundle/msi/*.msi.sig
            openless-all/app/src-tauri/target/release/bundle/latest-windows-x86_64*.json
          if-no-files-found: error

      # ── tag 推送时,同步上传到 GitHub Release ──
      # 只有 leader job (darwin/aarch64) 把 release body 写到文件,其余 matrix job
      # 的 body_path 留空,softprops/action-gh-release@v2 在 body 为空时会保留
      # existing release body 不动,避免每个 matrix job 都 append 一遍同样的 prelude
      # 导致 release notes 重复 N 次。
      - name: Prepare release body prelude
        if: matrix.updater-target == 'darwin' && matrix.updater-arch == 'aarch64' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/release-body.md" << 'EOF'
          ### macOS 用户首次安装提示

          下载 DMG 拖入 `/Applications` 后，**必须**在终端运行：

          ```bash
          xattr -cr /Applications/OpenLess.app
          ```

          否则 Gatekeeper 会提示「OpenLess 已损坏」——这是因为当前 build 用 ad-hoc 签名、没做 Apple 公证。

          ### 渠道说明

          - 以 `-tauri` 结尾的 tag 是**正式版**（自动推送给所有 in-app 检查更新的用户）。
          - 以 `-beta-tauri` 结尾或包含 `-Beta.N-tauri` 的 tag 是 **Beta 版**（GitHub 标 pre-release，**不**通过 in-app updater 推送给正式版用户；只对在「设置 → 关于 → 加入 Beta 渠道」开关切到 Beta 的用户可见，且需要手动从此页面下载安装）。

          ### 行为变更提示

          - 流式输入默认开启；不兼容场景会自动回落到一次性插入。可在「设置 → 高级」关闭。
          - 流式输入成功后默认把最终文本同步到剪贴板，方便再次粘贴；可在「设置 → 高级」关闭。
          EOF
          echo "OPENLESS_RELEASE_BODY_PATH=$RUNNER_TEMP/release-body.md" >> "$GITHUB_ENV"

      - name: Create / update release
        # 任何 v* tag（-egui / -tauri）都要把三平台桌面包挂上同一个 release：
        # 四平台共事一个 tag 是当前约定，Linux deb/rpm 由 release-linux-egui job 上传。
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 'OpenLess ${{ github.ref_name }}'
          draft: false
          # beta 渠道的 release 必须标 prerelease=true：GitHub UI 会折叠它，
          # 普通用户看不到；同时只上传 latest-*-beta.json，正式版用户的
          # endpoint（latest-*.json）永远不会被覆盖，保证 Beta 不溢出正式版。
          prerelease: ${{ env.OPENLESS_RELEASE_CHANNEL == 'beta' }}
          # 非 leader job 的 OPENLESS_RELEASE_BODY_PATH 是空字符串,softprops 在
          # body 为空时走 `body || existing.body` 分支保留既有内容,不会覆盖。
          # leader job 用默认 append_body=false,每次完整覆盖 release body 为
          # "prelude + generated notes",re-run 同一 tag 时也保持 idempotent
          # (append_body=true 会让 re-run 把上轮 body 拼到前面、再次复制)。
          body_path: ${{ env.OPENLESS_RELEASE_BODY_PATH }}
          # generate_release_notes 也只在 leader 跑，避免 matrix jobs 重复生成。
          generate_release_notes: ${{ matrix.updater-target == 'darwin' && matrix.updater-arch == 'aarch64' }}
          files: |
            openless-all/app/src-tauri/target/release/bundle/dmg/*.dmg
            openless-all/app/src-tauri/target/release/bundle/macos/*.app.tar.gz
            openless-all/app/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            openless-all/app/src-tauri/target/release/bundle/nsis/*.exe
            openless-all/app/src-tauri/target/release/bundle/nsis/*.exe.sig
            openless-all/app/src-tauri/target/release/bundle/msi/*.msi
            openless-all/app/src-tauri/target/release/bundle/msi/*.msi.sig
            openless-all/app/src-tauri/target/release/bundle/latest-*.json

  # ── Linux 侧（egui 原生宿主）：四平台之一，与 Tauri 三层同 run **并发** ──
  # 这里把原 release-linux-egui.yml 的步骤**内联**成与 build 平级的普通 job，而不是
  # `uses:` 调用它：GitHub 会把可复用工作流渲染成嵌套可折叠的一层，Linux 在 Actions
  # 页面上就不与三个平台平级（用户明确不接受这种显示）。
  # release-linux-egui.yml 仍然保留，作为「只出 Linux 包」的单独手动入口；
  # ⚠ 两份步骤必须保持一致：scripts/linux-egui-release-contract.test.mjs 同时断言
  #   两份里的关键门禁字符串，改这里时必须同步改那边（漂移会让契约测试失败）。
  #
  # deb/rpm 打包与「手动安装」zip 组装都在**同一个 job** 里完成（用户要求合并）：
  #   编译插件 → 编译宿主 → 打 deb/rpm → 校验包内容与 ELF 依赖 → 校验和 →
  #   解出散装 payload → 加 install.sh + 重算 SHA256SUMS → 打 manual zip（不含 deb/rpm）
  #   → 硬门禁 → 上传 artifact → 附到 release。
  # 故意不写 needs: build —— 四个平台要同时开始编，而不是 Linux 等 macOS/Windows 编完。
  # 竞态：Linux 与 Tauri 三层会同时往同一个 release 写资产。softprops/action-gh-release
  # 是 create-or-update，但**首次建立** release 时并发的 create 会撞 422 already_exists；
  # 所以下面先幂等地确保 release 存在（gh release view || gh release create），
  # 再让它只做 attach/update，避免同一秒抢建。
  linux-egui:
    name: Linux egui packages (deb + rpm + manual zip)
    # 统一发布语义：任何发布标签（或手动 dispatch）都跑 Linux egui，不给它单独开关。
    if: ${{ !cancelled() }}
    # 跟 ci.yml 的 linux-core-contract 用同一个镜像，理由也一样：cpal 的 PipeWire
    # 后端需要 24.04 自带的 PipeWire/libspa ABI，22.04 的头文件编译不过 libspa 0.10.x。
    # ⚠ 分发基线（用户已确认，不要改回 22.04）：产出的 deb/rpm 需要 glibc ≥ 2.39，
    #   支持 Ubuntu 24.04+ 一类的新发行版；22.04 / Debian 12 不在范围内。
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      # dispatch 时 ref_name 是分支名（含 `/`，不能进文件名）；tag 推送时传 tag，
      # 且 tag 名自带 -egui 后缀，Linux 资产不会和桌面包撞名。
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
      # 与 build job 同一套渠道判定：beta release 必须保持 prerelease=true，
      # 否则这个 job 会把它「升格」成正式版并推送给所有用户。
      OPENLESS_RELEASE_CHANNEL: ${{ (endsWith(github.ref_name, '-beta-tauri') || endsWith(github.ref_name, '-beta-egui') || contains(github.ref_name, '-Beta.')) && 'beta' || 'stable' }}
      MANUAL_ZIP: OpenLess-Linux-egui-${{ github.ref_type == 'tag' && github.ref_name || format('run-{0}', github.run_number) }}-x86_64-manual.zip
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      # 这个 gate 必须排在编译之前：它只依赖 checkout 与 gh，几秒就能出结论。
      # 历史教训：它原来在依赖安装 + 插件构建 + 全量测试之后，一个不合规的
      # release_tag 会白烧掉 4.5 分钟 runner 才报错。
      - name: Validate release target and UI gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_TAG:-}" ]; then
            echo "release_tag is empty: only uploading Actions artifacts, no release is touched"
            exit 0
          fi
          case "$RELEASE_TAG" in
            v*) ;;
            *)
              echo "::error::release target '$RELEASE_TAG' must be an existing v* tag (e.g. v2.0.0-Beta.1-egui); leave it blank to only upload Actions artifacts"
              exit 1
              ;;
          esac
          if grep -q 'openless-linux-egui host stub' openless-all/app/linux-egui/src/main.rs; then
            echo "::error::The egui UI stub cannot be uploaded as a release asset"
            exit 1
          fi
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::tag '$RELEASE_TAG' does not exist in $GITHUB_REPOSITORY; push the tag first, or leave release_tag blank"
            exit 1
          fi
          echo "release target $RELEASE_TAG is a real tag in $GITHUB_REPOSITORY"

      - name: Install native build and packaging dependencies
        run: |
          sudo add-apt-repository -y universe || true
          sudo apt-get update
          sudo apt-get install -y \
            appstream \
            build-essential \
            cmake \
            desktop-file-utils \
            fcitx5-modules-dev \
            libasound2-dev \
            libdbus-1-dev \
            libpipewire-0.3-dev \
            libpulse-dev \
            libfcitx5config-dev \
            libfcitx5core-dev \
            libfcitx5utils-dev \
            libssl-dev \
            libwayland-dev \
            libx11-dev \
            libxkbcommon-dev \
            pkg-config \
            ripgrep \
            rpm \
            unzip \
            zip \

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'openless-all/app -> target'

      - name: Build fcitx5 plugin
        working-directory: openless-all/scripts/linux-fcitx5-plugin
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
          test -s build/libopenless.so
          test -s build/openless.conf

      - name: Verify framework-independent Linux contract
        working-directory: openless-all/app
        shell: pwsh
        run: |
          cargo test --locked -p openless-core
          cargo clippy --locked -p openless-core --all-targets
          cargo test --locked -p openless-linux-egui --all-targets
          node scripts/linux-egui-tauri-free-contract.test.mjs
          node scripts/linux-egui-release-contract.test.mjs
          ./scripts/check-core-deps.ps1
          ./scripts/check-core-deps.ps1 openless-linux-egui
          ./scripts/check-core-secret-surface.ps1
          ./scripts/check-core-test-isolation.ps1
          ./scripts/check-core-runtime-seam.ps1
          ./scripts/check-linux-public-surface.ps1

      - name: Validate Linux desktop metadata
        run: |
          desktop-file-validate openless-all/app/linux-egui/packaging/openless.desktop
          appstreamcli validate --no-net openless-all/app/linux-egui/packaging/top.openless.OpenLess.metainfo.xml

      - name: Build Linux egui host
        working-directory: openless-all/app
        run: cargo build --locked --release -p openless-linux-egui

      - name: Resolve package version
        id: version
        shell: bash
        working-directory: openless-all/app
        run: |
          if [ -n "${RELEASE_TAG:-}" ]; then
            VERSION=${RELEASE_TAG#v}
            # egui 产物统一用 -egui tag 后缀；-tauri 只保留为历史 tag 的兼容写法。
            VERSION=${VERSION%-egui}
            VERSION=${VERSION%-tauri}
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package deb and rpm without Tauri
        working-directory: openless-all/app
        env:
          OPENLESS_LINUX_VERSION: ${{ steps.version.outputs.version }}
          OPENLESS_LINUX_ARCH: x86_64
        run: bash scripts/package-linux-egui.sh

      - name: Verify package contents and ELF dependencies
        working-directory: openless-all/app
        run: |
          OUTPUT=target/linux-egui-packages
          test "$(find "$OUTPUT" -maxdepth 1 -name '*.deb' | wc -l)" -eq 1
          test "$(find "$OUTPUT" -maxdepth 1 -name '*.rpm' | wc -l)" -eq 1
          test "$(find "$OUTPUT" -maxdepth 1 -name '*.AppImage' | wc -l)" -eq 0
          ! ldd target/release/openless-linux-egui | grep -q 'not found'
          ! ldd target/release/openless-linux-egui | grep -Eqi 'webkit|wry|tauri'
          dpkg-deb -c "$OUTPUT"/*.deb | grep -q 'usr/bin/openless'
          dpkg-deb -c "$OUTPUT"/*.deb | grep -q 'fcitx5/libopenless.so'
          rpm -qlp "$OUTPUT"/*.rpm | grep -q '/usr/bin/openless'
          rpm -qlp "$OUTPUT"/*.rpm | grep -q '/usr/lib64/fcitx5/libopenless.so'

      - name: Generate release checksums
        working-directory: openless-all/app
        run: |
          set -euo pipefail
          OUTPUT=target/linux-egui-packages
          test "$(find "$OUTPUT" -maxdepth 1 -name '*.deb' | wc -l)" -eq 1
          test "$(find "$OUTPUT" -maxdepth 1 -name '*.rpm' | wc -l)" -eq 1
          test "$(find "$OUTPUT" -maxdepth 1 -name '*.AppImage' | wc -l)" -eq 0
          ( cd "$OUTPUT" && sha256sum ./*.deb ./*.rpm > SHA256SUMS )
          test "$(wc -l < "$OUTPUT/SHA256SUMS")" -eq 2
          cat "$OUTPUT/SHA256SUMS"

      - name: Verify Linux release checksums
        working-directory: openless-all/app
        run: |
          test -s target/linux-egui-packages/SHA256SUMS
          ( cd target/linux-egui-packages && sha256sum -c SHA256SUMS >/dev/null )

      # ── 手动安装包（散装文件）：给用不了 deb/rpm 的发行版 ──
      # zip 根 = install.sh + SHA256SUMS + usr/... 安装树；**不含 deb/rpm**（能装包的
      # 人直接下 release 里的 deb/rpm 资产，那两份仍然保留）。
      - name: Build the manual-install payload
        shell: bash
        run: |
          set -euo pipefail
          OUT=openless-all/app/target/linux-egui-packages
          deb=$(find "$OUT" -maxdepth 1 -name '*.deb' | head -1)
          test -n "$deb"
          mkdir -p manual
          # 用 dpkg-deb -x 解出精确安装树：不自己抄文件清单，payload 就不会和 deb 漂移
          # （下一步会逐项对比）。
          dpkg-deb -x "$deb" manual
          cp openless-all/app/scripts/linux-egui-manual-install.sh manual/install.sh
          chmod +x manual/install.sh
          bash -n manual/install.sh
          # 散装 payload 自己的校验和：覆盖 install.sh 与所有安装文件；不复用针对
          # deb/rpm 的那份 SHA256SUMS。
          ( cd manual && find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS )
          ( cd manual && sha256sum -c SHA256SUMS >/dev/null )
          # 逐项对比：散装文件必须与 deb 的内容清单完全一致（漏文件最难发现）。
          dpkg-deb -c "$deb" | awk '$1 !~ /^d/ {print $NF}' | sed 's|^\./||' | LC_ALL=C sort > "$RUNNER_TEMP/deb-files.txt"
          ( cd manual && find usr -type f | LC_ALL=C sort ) > "$RUNNER_TEMP/payload-files.txt"
          diff -u "$RUNNER_TEMP/deb-files.txt" "$RUNNER_TEMP/payload-files.txt"
          find manual -type f | LC_ALL=C sort

      - name: Zip the manual-install payload
        shell: bash
        run: |
          set -euo pipefail
          # 从 manual/ 内部打包：zip 里就是 install.sh、SHA256SUMS 与 usr/... 目录树，
          # 用户解压后直接 `sudo ./install.sh`。
          ( cd manual && zip -q -r "../$MANUAL_ZIP" . )
          test -s "$MANUAL_ZIP"
          unzip -Z1 "$MANUAL_ZIP"
          # 硬门禁：绝不能出现 deb/rpm。
          test "$(unzip -Z1 "$MANUAL_ZIP" | grep -cE '\.(deb|rpm)$' || true)" -eq 0
          for f in install.sh SHA256SUMS usr/bin/openless usr/lib/x86_64-linux-gnu/fcitx5/libopenless.so; do
            unzip -Z1 "$MANUAL_ZIP" | grep -qx "$f"
          done
          # 解压后校验和必须过（证明 zip 没有损坏 payload）。
          ( cd "$RUNNER_TEMP" && rm -rf manual-check && mkdir manual-check && cd manual-check \
            && unzip -q "$GITHUB_WORKSPACE/$MANUAL_ZIP" && sha256sum -c SHA256SUMS >/dev/null )
          # 收进打包输出目录：这样下面一个 artifact 就能同时带上 deb/rpm/校验和/zip。
          cp "$MANUAL_ZIP" openless-all/app/target/linux-egui-packages/

      - name: Upload Linux egui workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: openless-linux-egui-x86_64
          path: openless-all/app/target/linux-egui-packages/*
          if-no-files-found: error
          # 重跑同一个 run 时 v4 默认拒绝同名 artifact；发版重跑是常规操作。
          overwrite: true

      # 竞态处理：先幂等地保证 release 存在（并发的 create 会撞 422 already_exists），
      # 之后 softprops 只做 attach/update。标题与 body 留给 build job 的 leader 写。
      - name: Ensure the release exists before attaching Linux assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $RELEASE_TAG already exists"
            exit 0
          fi
          args=(--repo "$GITHUB_REPOSITORY" --verify-tag --title "OpenLess $RELEASE_TAG")
          if [ "${OPENLESS_RELEASE_CHANNEL:-stable}" = "beta" ]; then
            args+=(--prerelease)
          fi
          # 与并发的 Tauri job 同时创建时必有一方拿到 422，这里吞掉即可：
          # 只要最终 release 存在，后面的 attach 就成立。
          gh release create "$RELEASE_TAG" "${args[@]}" \
            --notes "Linux egui assets: deb/rpm + manual install bundle" \
            || gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

      - name: Attach Linux assets (deb/rpm + manual zip) to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          # 不传 name/body_path：release 不存在时用 tag 名作标题（tag 自带 -egui 后缀，
          # 不会误标成 Tauri）；已存在时保留 leader 写好的标题与 body。
          prerelease: ${{ env.OPENLESS_RELEASE_CHANNEL == 'beta' }}
          files: openless-all/app/target/linux-egui-packages/*
          fail_on_unmatched_files: true

  # ── 正式版发布后，自动更新 Homebrew cask ──
  # 为什么放进这条流水线，而不是单独的 `release: published` 工作流：softprops 用默认
  # GITHUB_TOKEN 创建的 Release 不会触发 `release` 事件的其它工作流（GitHub 防递归），
  # 所以独立的 update-cask 工作流永远不会被自动触发（历史上只在一次手动场景跑过且失败）。
  # 用 needs: build 串在构建之后、同一条流水线里，才能保证每次正式发版都自动更新 cask。
  #
  # 仅正式版：v*-tauri 且非 -beta-tauri。beta 不碰 Homebrew，避免把预发布版推给
  # `brew install --cask openless` 的用户。cask 文件在默认分支（beta）上，提交回该分支。
  #
  # ⚠ 统一发布语义下的影响（任何 v* 标签都出全平台产物）：这条 job 的 if 仍只认
  #   「稳定的 -tauri 标签」，所以推 v2.0.0-Beta.1-egui（或任何非 -tauri 后缀）时
  #   全平台产物照常发布，但 Homebrew cask **不会**更新 —— 这是刻意的分发边界
  #   （用户决定：cask 只跟 -tauri 正式版）。要让 brew 用户拿到新版，发一个不带
  #   Beta、后缀 -tauri 的标签即可，那时本 job 照旧自动更新 cask。
  update-homebrew-cask:
    name: Update Homebrew cask (stable only)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      && endsWith(github.ref, '-tauri')
      && !endsWith(github.ref, '-beta-tauri')
      && !contains(github.ref_name, '-Beta.')
    steps:
      - name: Checkout default branch (cask 住在这里)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version + DMG sha256 from the release
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          version="${version%-tauri}"

          # 直接下载 DMG 自己算 sha256，不依赖 GitHub 资产 digest 字段的时序/可用性。
          mkdir -p "$RUNNER_TEMP/dmg"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/dmg" \
            --pattern '*aarch64.dmg' --pattern '*_x64.dmg'

          arm_sha="$(sha256sum "$RUNNER_TEMP"/dmg/*aarch64.dmg | cut -d' ' -f1)"
          intel_sha="$(sha256sum "$RUNNER_TEMP"/dmg/*_x64.dmg | cut -d' ' -f1)"

          {
            echo "version=$version"
            echo "arm_sha=$arm_sha"
            echo "intel_sha=$intel_sha"
          } >> "$GITHUB_OUTPUT"
          echo "cask → version=$version arm=$arm_sha intel=$intel_sha"

      - name: Update Casks/openless.rb
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          ARM_SHA: ${{ steps.meta.outputs.arm_sha }}
          INTEL_SHA: ${{ steps.meta.outputs.intel_sha }}
        run: |
          set -euo pipefail
          cask="Casks/openless.rb"
          # ⚠️ cask 第 2 行 `arch arm: "aarch64", intel: "x64"` 也含 `intel: "..."`，
          # 裸 `s/intel: "..."/` 会把 arch 指令一起改成哈希 → Intel 用户 brew 装包 404。
          # 所以 intel 的 sed 用 `^[[:space:]]*intel:` 锚定 sha256 块那一行；arm 的 sed
          # 靠 `sha256 arm:   ` 前缀天然只命中 sha256 行。捕获组 \1 保留原缩进。
          sed -i "s/version \"[^\"]*\"/version \"$VERSION\"/" "$cask"
          sed -i "s/sha256 arm:   \"[^\"]*\"/sha256 arm:   \"$ARM_SHA\"/" "$cask"
          sed -i "s/^\([[:space:]]*\)intel: \"[^\"]*\"/\1intel: \"$INTEL_SHA\"/" "$cask"
          # 防呆：arch 指令必须原样保留，且本次 sha256 必须确实写进去了，否则让 job 失败。
          grep -q 'arch arm: "aarch64", intel: "x64"' "$cask" \
            || { echo "::error::arch 指令被 sed 误伤"; exit 1; }
          grep -q "\"$ARM_SHA\"" "$cask" && grep -q "\"$INTEL_SHA\"" "$cask" \
            || { echo "::error::sha256 未正确写入 cask"; exit 1; }
          echo "----- updated $cask -----"
          cat "$cask"

      - name: Commit & push cask bump
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/openless.rb
          if git diff --cached --quiet; then
            echo "cask 已是 $VERSION，无需提交"
            exit 0
          fi
          # [skip ci]：cask 文本改动不需要再跑一遍跨平台 ci.yml。
          git commit -m "[cask] openless $VERSION (auto from release) [skip ci]"
          git push
