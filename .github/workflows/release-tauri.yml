name: Release Tauri (cross-platform)
# meta: ensure Actions indexes this workflow on forks (no behavior change).
# Triggers:
#   - push a v*.*.*-tauri tag (kept distinct from the legacy Swift vX.Y.Z tags, no conflict)
#   - manual dispatch (for test builds, no release)
#
# Outputs:
#   macOS arm64/x64 .dmg + Windows x64 .msi/.exe, uploaded automatically as GitHub Release assets.
#   Linux egui is built separately by release-linux-egui.yml; this workflow does not build Linux/Tauri.
#
# macOS distribution:
#   - With APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_ID /
#     APPLE_PASSWORD / APPLE_TEAM_ID configured, Tauri performs Developer ID signing and
#     notarization; users downloading from a browser do not need manual xattr.
#   - Without Apple secrets, falls back to ad-hoc signing; GitHub Actions prints a warning.
#   - Windows is unsigned (no certificate); Win 11 SmartScreen warns "Unknown publisher" and the
#     user clicks "Run anyway".
#   - One platform failing does not stop the other from building (fail-fast: false).

on:
  push:
    # Release bundles are only needed for tags. Feature-branch pushes used to run
    # this workflow purely to warm the release caches, which cost ~25 minutes per
    # push and stored ~2.3 GB of release trees in the shared `beta` cache scope.
    # The weekly schedule keeps that warm on the default branch instead.
    tags:
      - 'v*-tauri'
  schedule:
    # Monday 04:17 UTC: validate the release path and refresh the release caches.
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      platform:
        description: Desktop platforms to build (branch builds do not publish)
        type: choice
        options: [all, macos, windows]
        default: all
      release_tag:
        description: Existing draft Stable tag to repair (admin only, Windows only)
        type: string
        required: false
        default: ''

# Repeated pushes of the same tag run only the latest run; workflow_dispatch isolates by run_id
# to avoid mutual cancellation.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build:
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.platform == 'windows' && '[{"platform":"windows-latest","rust-target":"x86_64-pc-windows-msvc","updater-target":"windows","updater-arch":"x86_64"}]' || github.event_name == 'workflow_dispatch' && inputs.platform == 'macos' && '[{"platform":"macos-latest","rust-target":"aarch64-apple-darwin","updater-target":"darwin","updater-arch":"aarch64"},{"platform":"macos-15-intel","rust-target":"x86_64-apple-darwin","updater-target":"darwin","updater-arch":"x86_64"}]' || '[{"platform":"macos-latest","rust-target":"aarch64-apple-darwin","updater-target":"darwin","updater-arch":"aarch64"},{"platform":"macos-15-intel","rust-target":"x86_64-apple-darwin","updater-target":"darwin","updater-arch":"x86_64"},{"platform":"windows-latest","rust-target":"x86_64-pc-windows-msvc","updater-target":"windows","updater-arch":"x86_64"}]') }}
    runs-on: ${{ matrix.platform }}
    # A release build takes ~33 minutes from a cold cache; anything past this is
    # a hang that would otherwise hold the runner and the release for hours.
    timeout-minutes: 120
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # Channel is decided by the tag suffix:
      #   v<v>-beta-tauri / v<v>-Beta.N-tauri
      #                    -> beta channel (GitHub Release marked prerelease, manifest filename
      #                       carries a -beta suffix so stable users' endpoint never sees it)
      #   v<v>-tauri       -> stable channel (regular release; filenames follow the old
      #                       convention for backward compatibility)
      # On workflow_dispatch / non-tag triggers github.ref_name is not a tag string, endsWith
      # returns false, and it falls back to stable — dispatch behavior unchanged.
      OPENLESS_RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      OPENLESS_RELEASE_IS_TAG: ${{ (startsWith(github.ref, 'refs/tags/v') && endsWith(github.ref, '-tauri')) || inputs.release_tag != '' }}
      OPENLESS_RELEASE_CHANNEL: ${{ (endsWith(inputs.release_tag || github.ref_name, '-beta-tauri') || contains(inputs.release_tag || github.ref_name, '-Beta.')) && 'beta' || 'stable' }}
    steps:
      - name: Validate targeted draft release repair
        if: inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          [ "$INPUT_PLATFORM" = windows ] || { echo "::error::Repair dispatch is Windows-only"; exit 1; }
          [[ "$OPENLESS_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-tauri$ ]] || { echo "::error::Expected an existing Stable Tauri tag"; exit 1; }
          permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$GITHUB_ACTOR/permission" --jq .permission)
          [ "$permission" = admin ] || { echo "::error::Release repair requires an administrator"; exit 1; }
          draft=$(gh release view "$OPENLESS_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '(.isDraft and (.isPrerelease | not))')
          [ "$draft" = true ] || { echo "::error::Only an existing Stable draft may be repaired"; exit 1; }

      - uses: actions/checkout@v4
        with:
          # Repair packaging against the immutable, already-tested tag, never the tooling branch.
          ref: ${{ inputs.release_tag || github.ref }}
          submodules: false

      - name: Export source build provenance
        shell: bash
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::source SHA is not a full immutable commit"; exit 1; }
          echo "OPENLESS_BUILD_ID=$source_sha" >> "$GITHUB_ENV"
          echo "source_sha=$source_sha" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: 'openless-all/app/package-lock.json'

      - name: Verify repair source CI and version
        if: inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)
          version=$(node -p "require('./openless-all/app/src-tauri/tauri.conf.json').version")
          tag_version="${OPENLESS_RELEASE_TAG#v}"
          tag_version="${tag_version%-tauri}"
          [ "${version%%+*}" = "$tag_version" ] || { echo "::error::Tag/application version mismatch"; exit 1; }
          ci_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$source_sha&status=success&per_page=100" --jq "[.workflow_runs[] | select(.name == \"CI\" and .head_sha == \"$source_sha\" and .conclusion == \"success\")][0].id")
          [[ "$ci_id" =~ ^[0-9]+$ ]] || { echo "::error::No green CI for the exact tagged commit"; exit 1; }
          green=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ci_id/jobs?filter=latest&per_page=100" --jq '(.total_count == 7 and all(.jobs[]; .conclusion == "success"))')
          [ "$green" = true ] || { echo "::error::All seven tagged-commit CI gates must pass"; exit 1; }
          echo "Repair source verified: $source_sha ($version)"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      # Set up the actual build environment before restoring caches so the cache key includes
      # the macOS profile.
      - name: Configure macOS build environment
        if: startsWith(matrix.platform, 'macos')
        working-directory: openless-all/app
        run: bash scripts/macos-build-env.sh

      - name: Cache Cargo
        if: matrix.platform == 'windows-latest'
        uses: swatinem/rust-cache@v2
        with:
          # Restores the tree the beta `cross-platform` job maintains, so a tag
          # build starts warm instead of compiling every dependency from scratch.
          shared-key: tauri-windows
          workspaces: 'openless-all/app/src-tauri -> target'
          cache-on-failure: true

      - name: Cache macOS release dependencies
        if: startsWith(matrix.platform, 'macos')
        uses: swatinem/rust-cache@v2
        with:
          # Same prefix as the beta macOS check. The weekly schedule run fills it
          # with release-profile artifacts, so tag builds are warm.
          shared-key: tauri-macos
          workspaces: 'openless-all/app/src-tauri -> target'

      - name: Prepare Windows Sherpa static libraries
        if: matrix.platform == 'windows-latest'
        working-directory: 'openless-all/app'
        shell: pwsh
        run: ./scripts/prepare-windows-sherpa.ps1

      - name: Install npm deps
        working-directory: 'openless-all/app'
        run: npm ci

      - name: Check updater signing availability
        if: env.OPENLESS_RELEASE_IS_TAG == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is required for signed auto-update artifacts."
            exit 1
          fi

      - name: Check Apple signing availability
        if: startsWith(matrix.platform, 'macos') && env.OPENLESS_RELEASE_IS_TAG == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::warning::macOS release will use ad-hoc signing because Apple signing/notarization secrets are missing: ${missing[*]}"
          fi

      - name: Import Apple Developer ID certificate
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "${APPLE_CERTIFICATE:-}" ] || [ -z "${APPLE_CERTIFICATE_PASSWORD:-}" ]; then
            echo "No Apple certificate secrets configured; macOS build will use ad-hoc signing."
            exit 0
          fi

          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-$(openssl rand -base64 32)}"
          CERT_PATH="$RUNNER_TEMP/openless-certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/openless-build.keychain-db"

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          DEVELOPER_ID_INFO="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep 'Developer ID Application' | head -n 1)"
          if [ -n "$DEVELOPER_ID_INFO" ]; then
            CERT_INFO="$DEVELOPER_ID_INFO"
          else
            CERT_INFO="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -E 'Apple Distribution|Apple Development' | head -n 1)"
          fi
          if [ -z "$CERT_INFO" ]; then
            echo "Apple certificate imported, but no usable code-signing identity was found."
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            exit 1
          fi

          CERT_ID="$(echo "$CERT_INFO" | awk -F'"' '{print $2}')"
          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"
          echo "Imported Apple signing identity: $CERT_ID"

      - name: Configure Apple notarization
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PROVIDER_SHORT_NAME: ${{ secrets.APPLE_PROVIDER_SHORT_NAME }}
        run: |
          for name in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_PROVIDER_SHORT_NAME; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              echo "$name=$value" >> "$GITHUB_ENV"
            fi
          done

      # ── macOS: use our own build-mac.sh, handling signing, notarization, and artifact cleanup ──
      - name: Build (macOS)
        if: startsWith(matrix.platform, 'macos')
        working-directory: 'openless-all/app'
        env:
          INSTALL: '0'        # CI must not install to /Applications or reset TCC
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/build-mac.sh

      - name: Upload macOS Cargo timings
        if: always() && startsWith(matrix.platform, 'macos')
        uses: actions/upload-artifact@v4
        with:
          name: macos-cargo-timings-${{ matrix.updater-arch }}
          path: openless-all/app/src-tauri/target/cargo-timings/*.html
          if-no-files-found: ignore

      # ── Windows: build OpenLessIme.dll (x64+x86) first, then run tauri bundle.
      #    openless-ime.wxs reads absolute paths from $(env.OPENLESS_IME_DLL_X64) / _X86,
      #    resolvable across candle/light cwd changes (Tauri's wix bundler cwd is not fixed).
      - name: Build Windows IME native DLLs
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        working-directory: 'openless-all/app'
        run: |
          $appRoot = (Resolve-Path .).Path
          foreach ($t in @(
            @{ Platform = 'x64';   Folder = 'x64'; EnvName = 'OPENLESS_IME_DLL_X64' },
            @{ Platform = 'Win32'; Folder = 'x86'; EnvName = 'OPENLESS_IME_DLL_X86' }
          )) {
            $out = Join-Path $appRoot "src-tauri\target\windows-ime-msvc\$($t.Folder)\Release"
            $obj = Join-Path $appRoot "src-tauri\target\windows-ime-msvc\obj\$($t.Folder)\Release"
            ./scripts/windows-ime-build.ps1 -Configuration Release -Platform $t.Platform -OutputDirectory $out -IntermediateDirectory $obj
            if ($LASTEXITCODE -ne 0) {
              throw "OpenLessIme $($t.Platform) build failed with exit $LASTEXITCODE"
            }
            $dll = (Resolve-Path (Join-Path $out 'OpenLessIme.dll')).Path
            if (-not (Test-Path $dll)) {
              throw "OpenLessIme.dll not produced at $dll"
            }
            "$($t.EnvName)=$dll" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "[ok] built $dll (exported $($t.EnvName))"

            # bundle.resources references src-tauri/openless-ime-payload/{x64,x86}/OpenLessIme.dll
            # (the repo commits 0-byte placeholders so mac local builds can also resolve).
            # Overwrite the placeholders with the real dlls so NSIS / MSI install real files;
            # the NSIS hook's regsvr32 also registers the 64/32-bit COM classes under
            # HKLM\Software\Classes\CLSID on both the KEY_WOW64_64KEY / KEY_WOW64_32KEY
            # views (both are checked by windows_ime_profile.rs).
            $payloadDir = Join-Path $appRoot "src-tauri\openless-ime-payload\$($t.Folder)"
            New-Item -ItemType Directory -Force -Path $payloadDir | Out-Null
            Copy-Item -Force -Path $dll -Destination (Join-Path $payloadDir 'OpenLessIme.dll')
            Write-Host "[ok] copied real $($t.Folder) dll into bundle.resources payload path"
          }

      # ── Windows tauri build: keep the bash shell, because PowerShell invoking external
      #    commands strips the inner double quotes of '{"bundle":...}' and tauri receives
      #    invalid JSON.
      #    Use set +e + GITHUB_ENV to pass the exit code to the next step for Repair.
      - name: Build (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        working-directory: 'openless-all/app'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # [DEBUG-VOICE-1003] Matching Windows symbols for native crash diagnosis.
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
          CARGO_PROFILE_RELEASE_STRIP: none
        run: |
          set +e
          # WiX/MSI only accepts a numeric prerelease identifier.  Manual
          # validation runs use the repository's Beta version even though the
          # ref is a branch (and therefore OPENLESS_RELEASE_CHANNEL=stable),
          # so detect the version explicitly instead of relying on the tag.
          app_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          msi_supported=1
          if [[ "$app_version" =~ -[^0-9] ]]; then
            msi_supported=0
            echo "[info] Skipping MSI bundle for non-numeric prerelease version $app_version."
          fi
          # Run in two passes: Tauri's signing / updater artifact stage is a post-bundle hook,
          # and any bundler failure makes *all* bundles skip their .sig. MSI always hits ICE80,
          # so a single `tauri build` can never produce the NSIS .exe.sig.
          # Pass 1: NSIS alone — must succeed, producing *_x64-setup.exe(.sig) for the updater.
          # Pass 2: MSI alone — allowed to fail; the Repair step re-links with light.exe.
          # Beta skips MSI: Windows Installer / WiX cannot represent non-numeric prerelease
          # identifiers like `1.2.3-Beta.1`; stable still produces MSI as usual.
          # MSI ProductVersion is numeric and 16-bit bounded. Keep the full app
          # version (including +build.YYYYMMDD) untouched; override WiX only.
          node <<'MSI_CONFIG'
          const fs = require('node:fs');
          const version = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8')).version;
          const match = /^(\d+)\.(\d+)\.(\d+)(?:[-+].*)?$/.exec(version);
          if (!match) throw new Error('Invalid application version for MSI');
          const [major, minor, patch] = match.slice(1).map(Number);
          if (major > 255 || minor > 255 || patch > 65535) throw new Error('MSI version component exceeds Windows limits');
          const overlay = { bundle: { windows: { wix: { version: [major, minor, patch, 0].join('.') } } } };
          if (process.env.TAURI_SIGNING_PRIVATE_KEY) overlay.bundle.createUpdaterArtifacts = true;
          fs.writeFileSync('src-tauri/tauri.msi-version.json', JSON.stringify(overlay));
          MSI_CONFIG
          msi_config_exit=$?
          if [ "$msi_config_exit" -ne 0 ]; then exit "$msi_config_exit"; fi
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            npm run tauri -- build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":true}}'
            nsis_exit=$?
            if [ "${OPENLESS_RELEASE_CHANNEL:-stable}" = "beta" ] || [ "$msi_supported" -eq 0 ]; then
              echo "OPENLESS_SKIP_WINDOWS_MSI=1" >> "$GITHUB_ENV"
              echo "[info] Skipping MSI bundle for unsupported prerelease/channel."
              msi_exit=0
            else
              echo "OPENLESS_SKIP_WINDOWS_MSI=0" >> "$GITHUB_ENV"
              npm run tauri -- build --bundles msi --config src-tauri/tauri.msi-version.json
              msi_exit=$?
            fi
          else
            npm run tauri -- build --bundles nsis
            nsis_exit=$?
            if [ "${OPENLESS_RELEASE_CHANNEL:-stable}" = "beta" ] || [ "$msi_supported" -eq 0 ]; then
              echo "OPENLESS_SKIP_WINDOWS_MSI=1" >> "$GITHUB_ENV"
              echo "[info] Skipping MSI bundle for unsupported prerelease/channel."
              msi_exit=0
            else
              echo "OPENLESS_SKIP_WINDOWS_MSI=0" >> "$GITHUB_ENV"
              npm run tauri -- build --bundles msi --config src-tauri/tauri.msi-version.json
              msi_exit=$?
            fi
          fi
          echo "TAURI_BUILD_EXIT=$msi_exit" >> "$GITHUB_ENV"
          # NSIS is a hard dependency of the updater; fail the step outright if it fails.
          if [ "$nsis_exit" -ne 0 ]; then
            echo "::error::NSIS bundle failed (exit $nsis_exit) — updater artifact unavailable."
            exit 1
          fi
          # MSI failure does not block — the next Repair step re-links with light.exe (with -sice:ICE80).
          exit 0

      # ── If tauri fails at the wix link stage (candle produced wixobj, but light cannot find
      #    the IME DLL because of cwd-relative wxs Source resolution), manually run light from
      #    appRoot to re-link. Same surgery as the local windows-package-msvc.ps1
      #    ::Repair-TauriMsiBundle.
      - name: Repair Windows MSI if Tauri failed at WiX link
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        working-directory: 'openless-all/app'
        run: |
          $exitCode = $env:TAURI_BUILD_EXIT
          if ($env:OPENLESS_SKIP_WINDOWS_MSI -eq '1') {
            Write-Host "[ok] Skipping MSI repair for beta release channel."
            return
          }
          $appRoot = (Resolve-Path .).Path
          $msi = Get-ChildItem "src-tauri\target\release\bundle\msi\*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) {
            Write-Host "[ok] MSI already produced by tauri: $($msi.FullName); no repair needed."
            return
          }
          if (-not $exitCode -or $exitCode -eq '0') {
            throw "Tauri exited 0 but no MSI found at src-tauri\target\release\bundle\msi\"
          }
          Write-Warning "Tauri MSI failed (exit $exitCode). Attempting manual light.exe relink from app root."
          $wixRoot = Join-Path $appRoot 'src-tauri\target\release\wix\x64'
          $mainObj = Join-Path $wixRoot 'main.wixobj'
          $imeObj  = Join-Path $wixRoot 'openless-ime.wixobj'
          $locale  = Join-Path $wixRoot 'locale.wxl'
          foreach ($p in @($mainObj, $imeObj, $locale)) {
            if (-not (Test-Path $p)) {
              throw "Required WiX object missing: $p — tauri build aborted before candle ran. Check the Build (Windows) step log."
            }
          }
          $light = Get-ChildItem "$env:LOCALAPPDATA\tauri\WixTools*\light.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName |
            Select-Object -Last 1 -ExpandProperty FullName
          if (-not $light) { throw "WiX light.exe not found under $env:LOCALAPPDATA\tauri\WixTools*" }
          $version = (Get-Content src-tauri\tauri.conf.json -Raw | ConvertFrom-Json).version
          $bundleDir = Join-Path $appRoot 'src-tauri\target\release\bundle\msi'
          New-Item -ItemType Directory -Force -Path $bundleDir | Out-Null
          $msiPath = Join-Path $bundleDir "OpenLess_${version}_x64_en-US.msi"
          Push-Location $appRoot
          try {
            # -sice:ICE80: the x86 IME DLL is bundled alongside x64 under INSTALLDIR\windows-ime\;
            # a 32-bit component under a 64-bit Directory is legitimate here (the DLL path is
            # absolute and does not rely on SysWOW64 redirection). Tauri exposes no pass-through
            # for light arguments, so ICE80 must be suppressed here or LGHT0204 always fails.
            & $light -nologo -sice:ICE80 -ext WixUIExtension -ext WixUtilExtension -loc $locale -out $msiPath $mainObj $imeObj
            if ($LASTEXITCODE -ne 0) { throw "light.exe relink failed with exit $LASTEXITCODE" }
          } finally {
            Pop-Location
          }
          Write-Host "[ok] MSI rebuilt at $msiPath"

      # Tests are tooling, not application payload. A targeted repair checks out
      # immutable app source above, but uses the reviewed workflow commit's smoke
      # script so fixes to test semantics do not require moving a release tag.
      - name: Fetch installer smoke tooling
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLING_SHA: ${{ github.workflow_sha }}
        run: |
          # Fetch only the pinned script: a sparse checkout still visits unrelated
          # gitlinks during auth cleanup, including optional vendor runtimes.
          $scriptPath = 'openless-all/app/scripts/windows-ime-install-smoke.ps1'
          $encoded = gh api "repos/$env:GITHUB_REPOSITORY/contents/$scriptPath" --method GET -f "ref=$env:TOOLING_SHA" --jq '.content'
          if ($LASTEXITCODE -ne 0) { throw 'Failed to fetch pinned installer smoke tooling.' }
          $bytes = [Convert]::FromBase64String(($encoded -join ''))
          if ($bytes.Length -eq 0) { throw 'Pinned installer smoke tooling is empty.' }
          $destination = Join-Path $env:GITHUB_WORKSPACE "release-tooling/$scriptPath"
          New-Item -ItemType Directory -Force -Path (Split-Path $destination -Parent) | Out-Null
          [System.IO.File]::WriteAllBytes($destination, $bytes)

      - name: Verify Windows installers register TSF IME
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        working-directory: 'openless-all/app'
        run: |
          # The disposable runner must not be shut down by MSI Restart Manager
          # after the NSIS install/uninstall has loaded the TSF DLLs. /norestart
          # suppresses an OS reboot, not Restart Manager application shutdown.
          # Keep both real installer/registry checks; restore the machine policy.
          $smokeScript = Join-Path $env:GITHUB_WORKSPACE 'release-tooling\openless-all\app\scripts\windows-ime-install-smoke.ps1'
          $policy = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Installer'
          $policyName = 'DisableAutomaticApplicationShutdown'
          $previous = (Get-ItemProperty -LiteralPath $policy -Name $policyName -ErrorAction SilentlyContinue).$policyName
          try {
            New-Item -Path $policy -Force | Out-Null
            New-ItemProperty -LiteralPath $policy -Name $policyName -PropertyType DWord -Value 1 -Force | Out-Null
            $nsis = Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe" -ErrorAction Stop | Select-Object -First 1
            if (-not $nsis) { throw "NSIS installer not found." }
            $nsisLog = Join-Path $env:RUNNER_TEMP 'openless-nsis-install.log'
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File $smokeScript -InstallerPath $nsis.FullName -InstallerKind nsis -InstallerLogPath $nsisLog
            if ($LASTEXITCODE -ne 0) {
              throw "NSIS installer smoke failed with exit $LASTEXITCODE"
            }
            if ($env:OPENLESS_SKIP_WINDOWS_MSI -eq '1') {
              Write-Host "[ok] Skipping MSI smoke for beta release channel."
              return
            }
            $msi = Get-ChildItem "src-tauri\target\release\bundle\msi\*.msi" -ErrorAction Stop | Select-Object -First 1
            if (-not $msi) { throw "MSI installer not found." }
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File $smokeScript -InstallerPath $msi.FullName -InstallerKind msi
            if ($LASTEXITCODE -ne 0) {
              throw "MSI installer smoke failed with exit $LASTEXITCODE"
            }
          } finally {
            if ($null -ne $previous) {
              New-ItemProperty -LiteralPath $policy -Name $policyName -PropertyType DWord -Value $previous -Force | Out-Null
            } else {
              Remove-ItemProperty -LiteralPath $policy -Name $policyName -ErrorAction SilentlyContinue
            }
          }

      - name: Disambiguate macOS updater bundle filename
        if: startsWith(matrix.platform, 'macos') && env.TAURI_SIGNING_PRIVATE_KEY != ''
        shell: bash
        working-directory: 'openless-all/app/src-tauri/target/release/bundle/macos'
        run: |
          if [ -f OpenLess.app.tar.gz ]; then
            mv OpenLess.app.tar.gz "OpenLess_${{ matrix.updater-arch }}.app.tar.gz"
          fi
          if [ -f OpenLess.app.tar.gz.sig ]; then
            mv OpenLess.app.tar.gz.sig "OpenLess_${{ matrix.updater-arch }}.app.tar.gz.sig"
          fi

      - name: Write updater manifest
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        shell: bash
        working-directory: 'openless-all/app'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          OPENLESS_UPDATE_TARGET: ${{ matrix.updater-target }}
          OPENLESS_UPDATE_ARCH: ${{ matrix.updater-arch }}
          OPENLESS_UPDATE_CDN_BASE_URL: https://dl.aeoform.com
          # On the beta channel output latest-{tgt}-{arch}-beta.json; stable keeps the old filename.
          OPENLESS_RELEASE_CHANNEL: ${{ env.OPENLESS_RELEASE_CHANNEL }}
          # Manifest URLs use the CDN's tag-scoped `releases/<tag>/<asset>` path. Stable
          # workflow validation without a release tag falls back to the CDN `latest` path.
          OPENLESS_RELEASE_TAG: ${{ env.OPENLESS_RELEASE_TAG }}
        run: node scripts/write-updater-manifest.mjs

      - name: Write Windows artifact provenance
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        working-directory: 'openless-all/app'
        run: |
          $manifestDir = Join-Path (Resolve-Path 'src-tauri\target\release\bundle') 'provenance'
          New-Item -ItemType Directory -Force -Path $manifestDir | Out-Null
          $version = (Get-Content 'src-tauri\tauri.conf.json' -Raw | ConvertFrom-Json).version
          [ordered]@{
            schema = 'openless.artifact-provenance.v1'
            source_sha = $env:OPENLESS_BUILD_ID
            workflow_sha = $env:GITHUB_WORKFLOW_SHA
            run_id = $env:GITHUB_RUN_ID
            ref = $env:GITHUB_REF
            app_version = $version
            platform = 'windows'
            protocol_revision = '0x4F4C0009'
          } | ConvertTo-Json -Compress | Set-Content -Encoding utf8NoBOM (Join-Path $manifestDir 'openless-provenance.json')

      # ── Collect artifacts ──
      - name: List artifacts (debug)
        shell: bash
        working-directory: 'openless-all/app/src-tauri/target/release/bundle'
        run: ls -la macos/ dmg/ nsis/ msi/ 2>/dev/null || true

      # Defensive step: strip any residual extended attributes / quarantine from macOS bundles.
      # In theory GitHub Actions output .app/.dmg never carries com.apple.quarantine (and xattr
      # does not persist across machines via actions/upload-artifact), but keeping this step
      # makes "cloud artifacts are always clean" a verifiable promise. If the user's local
      # browser adds quarantine after download, the `xattr -cr` line in the release notes
      # removes it.
      - name: Strip xattr / quarantine on macOS bundles
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        working-directory: 'openless-all/app/src-tauri/target/release/bundle'
        run: |
          for path in macos/*.app dmg/*.dmg; do
            if [ -e "$path" ]; then
              echo "▶ stripping xattr: $path"
              xattr -cr "$path" || true
              xattr -lr "$path" || true
            fi
          done

      - name: Stage direct download alias
        if: startsWith(github.ref, 'refs/tags/v') && endsWith(github.ref, '-tauri')
        working-directory: openless-all/app
        env:
          OPENLESS_DOWNLOAD_TARGET: ${{ matrix.updater-target }}
          OPENLESS_DOWNLOAD_ARCH: ${{ matrix.updater-arch }}
          OPENLESS_DOWNLOAD_SOURCE_DIR: ${{ matrix.updater-target == 'darwin' && 'src-tauri/target/release/bundle/dmg' || 'src-tauri/target/release/bundle/nsis' }}
          OPENLESS_DOWNLOAD_OUTPUT_DIR: src-tauri/target/release/downloads
        run: node scripts/stage-release-download-aliases.mjs

      - name: Upload macOS artifacts
        if: startsWith(matrix.platform, 'macos')
        uses: actions/upload-artifact@v4
        with:
          name: openless-macos-${{ matrix.updater-arch }}
          compression-level: 0
          path: |
            openless-all/app/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload macOS updater artifacts
        if: startsWith(matrix.platform, 'macos') && env.TAURI_SIGNING_PRIVATE_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: openless-macos-${{ matrix.updater-arch }}-updater
          compression-level: 0
          path: |
            openless-all/app/src-tauri/target/release/bundle/macos/*.app.tar.gz
            openless-all/app/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            openless-all/app/src-tauri/target/release/bundle/latest-darwin-${{ matrix.updater-arch }}*.json
          if-no-files-found: error

      # [DEBUG-VOICE-1003] Verify both matching files exist before publishing diagnostics.
      - name: Verify Windows diagnostic symbols
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $files = @('openless-all/app/src-tauri/target/release/openless.exe', 'openless-all/app/src-tauri/target/release/openless.pdb')
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw 'Missing Windows diagnostic binary or symbols' }
            Get-FileHash -Algorithm SHA256 $file
          }

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: openless-windows-x64
          path: |
            openless-all/app/src-tauri/target/release/bundle/nsis/*.exe
            openless-all/app/src-tauri/target/release/bundle/msi/*.msi
            openless-all/app/src-tauri/target/release/openless.exe
            openless-all/app/src-tauri/target/release/openless.pdb
            openless-all/app/src-tauri/target/release/bundle/provenance/openless-provenance.json
          if-no-files-found: error

      - name: Upload Windows updater artifacts
        if: matrix.platform == 'windows-latest' && env.TAURI_SIGNING_PRIVATE_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: openless-windows-x64-updater
          path: |
            openless-all/app/src-tauri/target/release/bundle/nsis/*.exe.sig
            openless-all/app/src-tauri/target/release/bundle/msi/*.msi.sig
            openless-all/app/src-tauri/target/release/bundle/latest-windows-x86_64*.json
          if-no-files-found: error

      # ── On tag push, also upload to the GitHub Release ──
      # Only the leader job (darwin/aarch64) writes the release body to a file; the other matrix
      # jobs leave body_path empty. softprops/action-gh-release@v2 keeps the existing release
      # body when body is empty, so each matrix job does not append the same prelude again and
      # duplicate the release notes N times.
      - name: Prepare release body prelude
        if: matrix.updater-target == 'darwin' && matrix.updater-arch == 'aarch64' && env.OPENLESS_RELEASE_IS_TAG == 'true'
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/release-body.md" << 'EOF'
          ### macOS 用户首次安装提示

          下载 DMG 拖入 `/Applications` 后，**必须**在终端运行：

          ```bash
          xattr -cr /Applications/OpenLess.app
          ```

          否则 Gatekeeper 会提示「OpenLess 已损坏」——这是因为当前 build 用 ad-hoc 签名、没做 Apple 公证。

          ### 渠道说明

          - `vX.Y.Z-tauri` 是**正式版**，使用 Stable 更新源。
          - `vX.Y.Z-Beta.N-tauri` 是 **Beta 版**（GitHub pre-release）。在「设置 → 关于与更新 → 加入 Beta 频道」选择 Beta 更新源，也可从本页下载安装包。历史 `-beta-tauri` 标签继续兼容，Beta 不推送给 Stable 用户。

          ### 行为变更提示

          - 输入方式、流式输入与剪贴板选项位于「设置 → 录音与输入」，按平台能力显示。
          EOF
          echo "OPENLESS_RELEASE_BODY_PATH=$RUNNER_TEMP/release-body.md" >> "$GITHUB_ENV"

      - name: Confirm repair target remains draft
        if: inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [ "$(gh release view "$OPENLESS_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true ] || { echo "::error::Repair target was published; refusing to overwrite it"; exit 1; }

      - name: Create / update release
        if: env.OPENLESS_RELEASE_IS_TAG == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.OPENLESS_RELEASE_TAG }}
          name: 'OpenLess ${{ env.OPENLESS_RELEASE_TAG }}'
          # Both channels stay draft until all desktop/Android assets are verified.
          # The administrator explicitly publishes the shared release afterwards.
          draft: true
          # Beta releases must be marked prerelease=true: GitHub UI collapses them and regular
          # users do not see them. Channel isolation for the updater is a CDN URL path
          # (`/updates/stable/` vs `/updates/beta/`, see src-tauri/src/update_source.rs), not a
          # filename suffix in these assets.
          prerelease: ${{ env.OPENLESS_RELEASE_CHANNEL == 'beta' }}
          # Non-leader jobs have OPENLESS_RELEASE_BODY_PATH as an empty string; softprops keeps
          # the existing content via the `body || existing.body` branch when body is empty.
          # The leader job uses the default append_body=false and fully overwrites the release
          # body with "prelude + generated notes" each time, staying idempotent on re-runs of
          # the same tag (append_body=true would prepend the previous body again and duplicate).
          body_path: ${{ env.OPENLESS_RELEASE_BODY_PATH }}
          # generate_release_notes also runs only on the leader, avoiding duplicates from matrix jobs.
          generate_release_notes: ${{ matrix.updater-target == 'darwin' && matrix.updater-arch == 'aarch64' }}
          # `latest-*.json` is deliberately NOT attached: the in-app updater reads its manifests
          # from the project CDN (`/updates/{stable,beta}/`, see src-tauri/src/update_source.rs),
          # and cloning them here added fourteen near-identical files to every release. The
          # manifests still leave the workflow through the `*-updater` artifacts above, which is
          # where the CDN sync job picks them up.
          files: |
            openless-all/app/src-tauri/target/release/bundle/dmg/*.dmg
            openless-all/app/src-tauri/target/release/bundle/macos/*.app.tar.gz
            openless-all/app/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            openless-all/app/src-tauri/target/release/bundle/nsis/*.exe
            openless-all/app/src-tauri/target/release/bundle/nsis/*.exe.sig
            openless-all/app/src-tauri/target/release/bundle/msi/*.msi
            openless-all/app/src-tauri/target/release/bundle/msi/*.msi.sig
            openless-all/app/src-tauri/target/release/downloads/*

  # ── Hand the finished tag to the platform workflows that ride the same Release ──
  # `Release HarmonyOS` and `Release Linux egui` are dispatch-only on purpose: an
  # unaccepted HAP or deb/rpm must never reach users because someone pushed a
  # Tauri tag. Nothing used to link them to that tag, though, so both entry
  # points had **zero runs in their entire history** and every 2.0.x Release
  # shipped without a `.hap`, a `.deb` or a `.rpm` - the AppGallery upload never
  # ran either, and the omission was silent. Dispatch them here, once the desktop
  # matrix finished, so both find the Release they attach to (they wait only ten
  # minutes for it, less than the desktop matrix needs) and a tag push produces
  # one complete Release.
  #
  # `workflow_dispatch` is one of the two events `GITHUB_TOKEN` may still
  # trigger, so this needs no PAT - only `actions: write` for this job. The
  # downstream runs use the same release tag for their workflow definition and
  # checkout, so the package, workflow and cache inputs stay on one immutable ref.
  dispatch-platform-releases:
    needs: build
    # Independent of the desktop result: the HAP and the Linux packages only need
    # the tag, so a Windows-only or notarization failure must not cost them their
    # Release entry. A cancelled run still dispatches nothing.
    if: >-
      !cancelled() && github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') && endsWith(github.ref_name, '-tauri')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      # Repository distribution path by default: the HAP is attached to the
      # GitHub Release unsigned and nothing reaches AppGallery. Set the
      # `HARMONY_AUTO_CHANNEL` repository variable to `release` (production) or
      # `test` (test channel) to upload the signed package as the AGC candidate
      # automatically - the upload never submits it for review, so that decision
      # stays human either way.
      HARMONY_CHANNEL: ${{ vars.HARMONY_AUTO_CHANNEL || 'none' }}
    steps:
      - name: Dispatch the HarmonyOS and Linux releases
        run: |
          set -euo pipefail
          case "$HARMONY_CHANNEL" in
            none | release | test) ;;
            *) echo "::error::HARMONY_AUTO_CHANNEL must be none, release or test (got '$HARMONY_CHANNEL')"; exit 1 ;;
          esac
          gh workflow run release-harmony.yml \
            --ref "$RELEASE_TAG" \
            -f "tag=$RELEASE_TAG" \
            -f "channel=$HARMONY_CHANNEL" \
            -f publish=true \
            -f upload_to_appgallery=true
          gh workflow run release-linux-egui.yml \
            --ref "$RELEASE_TAG" \
            -f "tag=$RELEASE_TAG" \
            -f publish=true

      - name: Report the dispatched runs
        # Both dispatches already returned a run id; this listing is the log line
        # that makes the old silent miss visible, so a missing run must not fail
        # the tag build after every asset is already published.
        continue-on-error: true
        run: |
          set -euo pipefail
          sleep 10
          for workflow in release-harmony.yml release-linux-egui.yml; do
            echo "### $workflow"
            gh run list --workflow="$workflow" --limit 3 \
              --json createdAt,status,conclusion,url \
              --jq '.[] | "\(.createdAt) \(.status) \(.conclusion // "-") \(.url)"'
          done
