name: Cache maintenance

# GitHub keeps 10 GB of Actions caches per repository. The platform dependency
# trees are large (the Windows Tauri tree alone is ~1.6 GB), so unused scopes
# evict the caches the CI jobs restore - which silently turns every run into a
# cold build. This job keeps the budget visible and drops the scopes that can
# never be restored again: pull requests that are already closed or merged.
#
# It runs daily, when a pull request closes, and on demand. It retains the
# newest branch generations first, then evicts least-recently-used branch caches
# if the baseline alone exceeds budget. Tag and open PR scopes stay protected.
on:
  schedule:
    # Daily cleanup prevents superseded build generations evicting baseline caches.
    - cron: '17 3 * * *'
  pull_request:
    types: [closed]
    branches: [main, beta]
  workflow_dispatch:

permissions:
  actions: write # required to delete caches
  contents: read
  pull-requests: read # distinguish closed PR scopes from open/unreadable ones

concurrency:
  group: cache-maintenance
  cancel-in-progress: false

jobs:
  report:
    name: Report and prune caches
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          # A closed PR must not supply scripts executed with actions: write.
          ref: ${{ github.event_name == 'pull_request' && github.event.repository.default_branch || github.sha }}
          persist-credentials: false

      - name: Report cache usage and enforce the cache budget
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          LIMIT_GB: '8'
        working-directory: openless-all/app
        # `--keep-family 2` also drops superseded generations inside the branch
        # scope: only the two newest keys of one (branch, key family) pair stay,
        # because `restore-keys` never needs more than the previous generation.
        run: >-
          bash scripts/ci-cache-usage.sh
          --prune --keep-family 2 --prune-budget --repo "$REPO" --limit-gb "$LIMIT_GB"
