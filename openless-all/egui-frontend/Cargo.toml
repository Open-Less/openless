[package]
name = "openless-egui-frontend"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
egui = "=0.33.3"
eframe = { version = "0.33.3", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["glow", "default_fonts", "accesskit", "wayland", "x11"] }
winit = { version = "0.30", features = ["wayland", "x11"] }
