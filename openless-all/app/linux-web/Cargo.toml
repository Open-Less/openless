[package]
name = "openless-linux-web"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.54", features = ["rt-multi-thread"] }
openless-core = { path = "../crates/openless-core" }
openless-linux-host = { path = "../linux-host" }
