[package]
name = "openless-linux-host"
version = "0.1.0"
license = "AGPL-3.0-only"
description = "Linux host adapters (backend, tray, hotkeys, fcitx5) shared by the native hosts"
edition = "2021"
rust-version = "1.99"
publish = false

[dependencies]
openless-core = { path = "../crates/openless-core" }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
fs2 = "0.4"
futures-util = "0.3"
log = "0.4"
simplelog = "0.12"
base64 = "0.23.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[features]
default = []

[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9"
keyring = "4.2.0"
cpal = { version = "0.18.2", default-features = false, features = ["pipewire", "pulseaudio"] }

# wlr-layer-shell 胶囊窗口：KWin 6.7+/sway/Hyprland 等合成器直接给
# 「贴底居中 + 不抢键盘焦点」的 overlay surface；不支持时回退到 X11 叠加层。

# Rasterize user-supplied SVG icons locally before sending PNG to Core.

libc = "0.2"
roxmltree = "0.21.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }

axum = { version = "0.8.9", default-features = false, features = ["ws", "http1", "tokio"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "server", "http1"] }
local-ip-address = "0.6"
base64 = "0.23.1"
sha2 = "0.11.0"
rcgen = { version = "0.14.10", features = ["x509-parser"] }
x509-parser = { version = "0.18.1", features = ["verify"] }
time = "0.3"
tempfile = "3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
