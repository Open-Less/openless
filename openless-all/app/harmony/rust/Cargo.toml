[package]
name = "openless-harmony-host"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
openless-core = { path = "../../crates/openless-core" }
serde_json = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net"] }
base64 = "0.22"
