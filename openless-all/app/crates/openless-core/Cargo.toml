[package]
name = "openless-core"
version = "0.1.0"
license = "AGPL-3.0-only"
description = "Framework-independent OpenLess application core"
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
bzip2 = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = "0.3"
ferrous-opencc = "0.4"
hmac = "0.12"
log = "0.4"
md-5 = "0.10"
once_cell = "1"
parking_lot = "0.12"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tar = "0.4"
thiserror = "1"
# `rt`/`macros` are needed by the injected Tokio spawner and the core's
# asynchronous contract tests.  The core still does not own a runtime: hosts
# may provide another `TaskSpawner` implementation when they need a different
# executor.
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "rt-multi-thread", "net", "io-util"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
zip = "2"
