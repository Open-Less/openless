[package]
name = "openless-core"
version = "0.1.0"
license = "AGPL-3.0-only"
description = "Framework-independent OpenLess application core"
edition = "2021"
rust-version = "1.99"
publish = false

[dependencies]
anyhow = "1"
argon2 = { version = "0.6.0", features = ["zeroize"] }
base64 = "0.23.1"
bzip2 = "0.6.1"
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = "0.3"
getrandom = "0.4.3"
ferrous-opencc = "0.4"
hmac = "0.13.0"
hex = "0.4.3"
log = "0.4"
jsonwebtoken = { version = "11.1", default-features = false, features = ["rust_crypto"] }
md-5 = "0.11.0"
once_cell = "1"
parking_lot = "0.12"
regex = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "rustls", "stream", "system-proxy", "query", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11.0"
sha2 = "0.11.1"
tar = "0.4"
thiserror = "2.0.21"
# `rt`/`macros` are needed by the injected Tokio spawner and the core's
# asynchronous contract tests.  The core still does not own a runtime: hosts
# may provide another `TaskSpawner` implementation when they need a different
# executor.
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "rt-multi-thread", "net", "io-util"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
unicode-normalization = "0.1"
zeroize = { version = "1", features = ["derive"] }
zip = "9.0.0"

[dev-dependencies]
rsa = "0.9.10"
rand = "0.8.8"
