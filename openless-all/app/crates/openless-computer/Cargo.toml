[package]
name = "openless-computer"
version = "0.1.0"
edition = "2024"
description = "Native, single-request Computer tools for the bundled OpenLess PI backend"
license = "AGPL-3.0-only"

[dependencies]
base64 = "0.22"
enigo = { version = "0.6.1", default-features = false, features = ["x11rb"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xcap = "0.9.8"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["randr"] }
