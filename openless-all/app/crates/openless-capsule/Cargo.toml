[package]
name = "openless-capsule"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "AGPL-3.0-only"
publish = false
description = "Shared OpenLess capsule protocol and optional egui renderer"

[features]
default = []
ui = ["dep:egui", "dep:resvg"]
host = ["dep:tokio", "dep:log"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
egui = { version = "=0.37.0", optional = true }
resvg = { version = "=0.48.1", default-features = false, optional = true }
tokio = { version = "1", features = ["io-util", "process", "rt", "sync", "time", "macros"], optional = true }
log = { version = "0.4", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "process", "sync", "time"] }
