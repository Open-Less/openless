[package]
name = "openless-ios-host"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[workspace]
members = [".build/core-source/crates/openless-core"]
exclude = [".build/core-source/crates/micyou-dsp", ".build/core-source/crates/micyou-infer"]
resolver = "2"

[dependencies]
openless-core = { path = ".build/core-source/crates/openless-core" }
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

security-framework = "=3.7.0"
sha2 = "0.10"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
