<!doctype html><html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#18181b;color:#eee;font:16px system-ui;padding:18px}textarea{display:block;box-sizing:border-box;width:100%;height:170px;font:18px system-ui;background:#29292e;color:white;border:1px solid #777;border-radius:12px;padding:12px}h1{font-size:20px}</style><h1>Keyboard voice lifecycle fixture</h1><p>Synthetic text only. No microphone or model.</p><textarea aria-label="Voice gesture test input" enterkeyhint="send" autocorrect="off" spellcheck="false"></textarea><p id="submitted">Submitted: 0</p><script>const t=document.querySelector('textarea');let n=0;function sent(){document.querySelector('#submitted').textContent='Submitted: '+(++n)}t.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sent()}});t.addEventListener('input',()=>{if(t.value.includes('\n')){t.value=t.value.replace(/\n/g,'');sent()}});</script></html>
